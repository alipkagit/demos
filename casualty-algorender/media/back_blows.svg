<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="Back blows on a person bent forward">
  <g fill="none" stroke="#3a332e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- bent-forward person facing right -->
    <circle cx="232" cy="86" r="17" fill="#f3ece1"/>
    <!-- torso bent forward -->
    <path d="M150 118 L214 96"/>
    <!-- neck to head -->
    <path d="M214 96 L226 90"/>
    <!-- arms hanging -->
    <path d="M205 99 L214 150"/>
    <!-- legs -->
    <path d="M150 118 L150 196"/>
    <path d="M150 118 L128 196"/>
    <!-- rescuer hand (open) on upper back -->
    <path d="M150 70 q14 -10 26 4" stroke="#d8443a"/>
    <path d="M150 70 l-2 14 M158 67 l0 16 M167 69 l3 15" stroke="#d8443a"/>
    <!-- motion arrow striking down between shoulder blades -->
    <path d="M186 40 L182 80" stroke="#d8443a"/>
    <path d="M174 70 L182 82 L190 70" stroke="#d8443a"/>
    <!-- ground -->
    <path d="M96 206 L224 206" stroke="#cdbfa9" stroke-width="4"/>
  </g>
</svg>
