<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="Chest thrusts on a baby">
  <g fill="none" stroke="#3a332e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- baby lying face up -->
    <circle cx="86" cy="120" r="15" fill="#f3ece1"/>
    <path d="M100 120 L210 120"/>
    <path d="M210 120 L228 112"/>
    <path d="M210 120 L228 128"/>
    <!-- two finger dots on the middle of the chest -->
    <circle cx="150" cy="120" r="6" fill="#d8443a" stroke="none"/>
    <circle cx="168" cy="120" r="6" fill="#d8443a" stroke="none"/>
    <!-- push in-and-up arrow -->
    <path d="M159 168 L159 134" stroke="#d8443a"/>
    <path d="M151 144 L159 132 L167 144" stroke="#d8443a"/>
    <!-- surface -->
    <path d="M60 150 L200 150" stroke="#cdbfa9" stroke-width="4"/>
  </g>
</svg>
