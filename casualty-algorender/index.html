<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlgoRender — Casualty algorithm prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --font-display:'Fraunces',Georgia,serif;
    --font-sans:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --sev-info:#5b6b73;   --sev-info-bg:#eef2f3;
    --sev-safe:#2f8f5b;   --sev-safe-bg:#e9f5ed;
    --sev-caution:#bb7d12; --sev-caution-bg:#fbf2dd;
    --sev-severe:#df6a2c; --sev-severe-bg:#fceadd;
    --sev-critical:#d8443a; --sev-critical-bg:#fbe4e2;
    --radius:18px;
    --shadow:0 18px 50px -20px rgba(40,28,16,.45);
  }
  /* THEMES */
  body.theme-public{
    --paper:#FBF7F0; --ink:#231f1a; --muted:#7c7165; --line:#ece2d3;
    --card:#ffffff; --accent:#d8443a; --accent-ink:#fff; --chip:#f3ece1;
  }
  body.theme-hcp{
    --paper:#eef2f4; --ink:#192a2e; --muted:#5f7378; --line:#d8e2e4;
    --card:#ffffff; --accent:#1f7a72; --accent-ink:#fff; --chip:#e3edee;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--font-sans);
    background:
      radial-gradient(1200px 700px at 15% -10%, #efe7d8, transparent 60%),
      radial-gradient(1000px 800px at 110% 10%, #e7ecec, transparent 55%),
      #e4ded2;
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:20px 12px;
    -webkit-font-smoothing:antialiased;
  }
  .stage{display:flex;flex-direction:column;align-items:center;gap:12px}
  .caption{font-size:12.5px;color:#6b6256;letter-spacing:.01em;max-width:412px;text-align:center;line-height:1.5}
  .caption b{color:#3a332e}

  /* DEVICE */
  .device{
    width:412px; max-width:96vw; height:min(884px,94vh);
    background:#100f0e; border-radius:46px; padding:11px;
    box-shadow:var(--shadow);
  }
  .phone{
    position:relative; height:100%; width:100%;
    background:var(--paper); border-radius:36px; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:108px;height:24px;background:#100f0e;border-radius:14px;z-index:40}
  .statusbar{height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 24px;font-size:12px;font-weight:600;color:var(--ink);opacity:.7}
  .statusbar .dots{font-family:var(--font-mono);letter-spacing:1px}

  /* APP BAR */
  .appbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 16px 12px}
  .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 4px 10px -4px var(--accent)}
  .mark svg{width:18px;height:18px}
  .brand{line-height:1}
  .brand .b1{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.01em}
  .brand .b2{font-size:10.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
  .seg{margin-left:auto;display:flex;background:var(--chip);border-radius:999px;padding:3px}
  .seg button{border:0;background:transparent;font-family:var(--font-sans);font-weight:600;font-size:12px;color:var(--muted);padding:6px 11px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px -2px rgba(0,0,0,.18)}
  /* Emergency assistance — persistent top-right call action (replaces the public/clinician toggle) */
  .emr-btn{margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;
    background:var(--sev-critical);color:#fff;font-family:var(--font-sans);font-weight:700;font-size:12.5px;
    white-space:nowrap;padding:8px 13px;border-radius:999px;box-shadow:0 6px 16px -7px var(--sev-critical)}
  .emr-btn svg{width:15px;height:15px;flex:0 0 auto}
  .emr-btn:active{transform:translateY(1px)}

  /* SCREEN */
  .screen{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:4px 16px 26px;scroll-behavior:smooth}
  .screen::-webkit-scrollbar{width:0}

  h1.title{font-family:var(--font-display);font-weight:600;font-size:27px;line-height:1.1;margin:6px 2px 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 2px 14px;line-height:1.5}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:8px 2px 0}

  /* HOME CARDS */
  .home-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;margin-bottom:12px;cursor:pointer;overflow:hidden;transition:transform .12s ease, box-shadow .12s ease}
  .home-card:hover{transform:translateY(-2px);box-shadow:0 14px 30px -22px rgba(0,0,0,.5)}
  .home-card .rail{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
  .home-card h3{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0 0 3px}
  .home-card .cat{font-size:12.5px;color:var(--muted)}
  .home-card .meta{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
  .pill.sev{background:var(--sev-bg);color:var(--sev)}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

  /* DRAFT BANNER (validationStatus) */
  .draftbar{display:flex;gap:9px;align-items:flex-start;background:var(--sev-caution-bg);border:1px solid color-mix(in srgb,var(--sev-caution) 35%,transparent);color:#8a5d09;border-radius:12px;padding:9px 11px;margin:0 0 12px;font-size:12.5px;line-height:1.4;font-weight:500}
  .draftbar svg{width:16px;height:16px;flex:0 0 auto;margin-top:1px}
  .draftbar b{font-weight:700}
  .pill.draft{background:var(--sev-caution-bg);color:#8a5d09}

  /* CONTROL BAR */
  .ctrlbar{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
  .back{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px 7px 10px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  .modetoggle{margin-left:auto;display:flex;background:var(--chip);border-radius:999px;padding:3px}
  .modetoggle button{border:0;background:transparent;font-weight:600;font-size:12.5px;color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .modetoggle button.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 9px -3px var(--accent)}
  .modetoggle svg{width:14px;height:14px}

  /* CONTEXT BAR */
  .ctx{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:11px 13px;margin-bottom:14px}
  .ctx .lbl{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
  .choice{display:flex;gap:8px;flex-wrap:wrap}
  .choice button{flex:1;min-width:120px;border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:9px 10px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  .choice button.on{border-color:var(--accent);background:var(--sev-info-bg);box-shadow:inset 0 0 0 1px var(--accent)}
  .wt{display:flex;align-items:center;gap:9px}
  .wt input{flex:1;font-family:var(--font-mono);font-size:16px;font-weight:600;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--paper);color:var(--ink);width:100%}
  .wt input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
  .wt .u{font-family:var(--font-mono);font-weight:600;color:var(--muted)}

  /* NODE CARD (shared) */
  .node{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--sev);border-radius:var(--radius);padding:14px 15px;position:relative}
  .node .ntag{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .ntag .ico{width:24px;height:24px;border-radius:7px;background:var(--sev-bg);color:var(--sev);display:flex;align-items:center;justify-content:center}
  .ntag .ico svg{width:15px;height:15px}
  .ntag .tt{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--sev)}
  .node h2{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1.18;margin:0 0 4px}
  .prompt{font-size:13.5px;color:var(--muted);margin:2px 0 0}
  ul.body{list-style:none;margin:10px 0 0;padding:0}
  ul.body li{position:relative;padding:5px 0 5px 20px;font-size:14px;line-height:1.45;border-top:1px solid var(--line)}
  ul.body li:first-child{border-top:0}
  ul.body li::before{content:"";position:absolute;left:3px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--sev);opacity:.55}

  .warn{display:flex;gap:9px;background:var(--sev-critical-bg);border:1px solid color-mix(in srgb,var(--sev-critical) 30%,transparent);color:#9a2820;border-radius:12px;padding:10px 11px;margin-top:11px;font-size:13px;line-height:1.4;font-weight:500}
  .warn svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px}

  /* DON'TS (structured "Do NOT…" list) */
  .donts{background:var(--sev-critical-bg);border:1px solid color-mix(in srgb,var(--sev-critical) 30%,transparent);border-radius:12px;padding:10px 12px;margin-top:11px}
  .donts .dhead{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:#9a2820;margin-bottom:5px}
  .donts .dhead svg{width:15px;height:15px}
  .donts ul{list-style:none;margin:0;padding:0}
  .donts li{position:relative;padding:4px 0 4px 22px;font-size:13px;line-height:1.4;color:#9a2820;font-weight:500}
  .donts li::before{content:"✕";position:absolute;left:5px;top:4px;font-weight:700;font-size:12px}

  /* TIMER (countdown / stopwatch) */
  .timerbox{margin-top:11px;background:var(--sev-info-bg);border:1px solid var(--line);border-radius:14px;padding:12px}
  .timerbox .tlbl{font-size:13px;font-weight:700;margin-bottom:8px}
  .timerbox .tdisp{font-family:var(--font-mono);font-size:40px;font-weight:600;line-height:1;text-align:center;color:var(--ink);letter-spacing:.02em}
  .timerbox.over .tdisp,.timerbox.over .tlbl{color:var(--sev-critical)}
  .timerbox.done .tdisp{color:var(--sev-safe)}
  .timerbox .tnote{text-align:center;font-size:12px;color:var(--muted);margin-top:5px;min-height:16px}
  .timerbox.over .tnote{color:var(--sev-critical);font-weight:600}
  .tctrls{display:flex;gap:9px;margin-top:11px}
  .tctrls button{flex:1;border:0;border-radius:12px;padding:11px;font-family:var(--font-sans);font-size:14px;font-weight:700;cursor:pointer}
  .t-start{background:var(--accent);color:var(--accent-ink)}
  .t-reset{flex:0 0 auto;background:var(--chip);color:var(--ink);padding:11px 16px}

  /* DOSING */
  .dose{margin-top:11px;background:var(--sev-info-bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .dose .drug{font-size:13px;font-weight:700;margin-bottom:5px}
  .dose .val{font-family:var(--font-mono);font-size:21px;font-weight:600;color:var(--ink);line-height:1}
  .dose .val .calc{color:var(--accent)}
  .dose .formula{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:4px}
  .dose .note{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}
  .dose .hint{font-size:12px;color:var(--accent);font-weight:600;margin-top:6px}
  .dose+.dose{margin-top:8px}
  .bands{display:flex;flex-direction:column;gap:5px;margin-top:6px}
  .band{display:flex;justify-content:space-between;font-size:13px;font-family:var(--font-mono);padding:5px 9px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
  .band b{color:var(--accent)}

  /* CHIPS row (refs/links) */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;cursor:pointer;color:var(--ink)}
  .chip svg{width:13px;height:13px;color:var(--muted)}
  .chip.call{background:var(--sev-critical);border-color:var(--sev-critical);color:#fff}
  .chip.call svg{color:#fff}

  .media{margin-top:12px;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:6px}
  .media img{width:100%;display:block;border-radius:10px;background:#fff}
  .media .cap{font-size:12px;color:var(--muted);padding:7px 8px 4px;line-height:1.4}

  /* MAP */
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin:0 2px 12px;font-size:11px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .connector{height:22px;display:flex;justify-content:center}
  .connector::before{content:"";width:2px;background:var(--line)}
  .flow .node{cursor:pointer;transition:box-shadow .12s ease, transform .12s ease}
  .flow .node:hover{box-shadow:0 12px 26px -20px rgba(0,0,0,.55)}
  .flow .node.pulse{animation:pulse 1.1s ease}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
  .branches{display:flex;flex-direction:column;gap:8px;margin-top:11px}
  .branch{display:flex;align-items:flex-start;gap:9px;text-align:left;border:1px solid var(--line);background:var(--paper);border-left:4px solid var(--sev);border-radius:11px;padding:9px 11px;cursor:pointer;width:100%}
  .branch .bl{font-size:13.5px;font-weight:700;color:var(--ink)}
  .branch .bd{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4;font-family:var(--font-mono)}
  .branch .arr{margin-left:auto;color:var(--sev);font-weight:700;flex:0 0 auto}
  .loopnote{font-size:11px;color:var(--muted);font-style:italic;margin-top:2px}

  /* GUIDE */
  .progress{display:flex;align-items:center;gap:7px;margin:2px 2px 12px}
  .progress .pn{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
  .track{display:flex;gap:5px}
  .track i{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .track i.on{background:var(--accent)}
  .gnav{margin-top:14px;display:flex;flex-direction:column;gap:9px}
  .gbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-radius:13px;padding:14px 16px;font-family:var(--font-sans);font-size:15px;font-weight:700;cursor:pointer;text-align:left;width:100%}
  .gbtn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px -10px var(--accent)}
  .gbtn.branch{background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--sev)}
  .gbtn.branch .bd{font-weight:500;font-size:12px;color:var(--muted);font-family:var(--font-mono);margin-top:3px}
  .gbtn .col{display:flex;flex-direction:column}
  .gbtn .arr{font-size:18px;opacity:.8}
  .restart{background:var(--chip);color:var(--ink)}

  /* CALL BAR (public) */
  .callbar{flex:0 0 auto;padding:10px 16px;border-top:1px solid var(--line);background:var(--paper)}
  .callbtn{width:100%;border:0;background:var(--sev-critical);color:#fff;font-family:var(--font-sans);font-weight:700;font-size:15px;border-radius:14px;padding:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 8px 22px -10px var(--sev-critical)}
  .callbtn svg{width:18px;height:18px}

  /* SHEET */
  .backdrop{position:fixed;inset:0;background:rgba(20,14,8,.42);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:60}
  .backdrop.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,102%);width:412px;max-width:96vw;max-height:82vh;background:var(--paper);border-radius:26px 26px 0 0;z-index:70;transition:transform .28s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;box-shadow:0 -20px 60px -20px rgba(0,0,0,.5)}
  .sheet.show{transform:translate(-50%,0)}
  .sheet .grip{width:42px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 4px;flex:0 0 auto}
  .sheet .shead{display:flex;align-items:center;gap:10px;padding:6px 18px 10px;border-bottom:1px solid var(--line)}
  .sheet .shead h2{font-family:var(--font-display);font-weight:600;font-size:18px;margin:0;flex:1}
  .sheet .x{border:0;background:var(--chip);width:30px;height:30px;border-radius:50%;font-size:16px;color:var(--ink);cursor:pointer;flex:0 0 auto}
  .sheet .sbody{overflow-y:auto;padding:14px 18px 24px}
  .steps{list-style:none;counter-reset:s;margin:8px 0 0;padding:0}
  .steps li{counter-increment:s;position:relative;padding:9px 0 9px 38px;font-size:14px;line-height:1.45;border-top:1px solid var(--line)}
  .steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:25px;height:25px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--font-mono);font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center}
  table.dt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  table.dt th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:7px 8px;border-bottom:2px solid var(--line)}
  table.dt td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.4}
  table.dt td:nth-child(1){font-weight:700}
  table.dt td:nth-child(2){font-family:var(--font-mono);color:var(--accent);white-space:nowrap}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  .sheet .startstep{margin-top:16px}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#171310;color:#fff;font-size:13.5px;font-weight:600;padding:12px 18px;border-radius:999px;z-index:90;opacity:0;transition:all .25s ease;pointer-events:none;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* CPR COACH */
  .coach{margin-top:4px}
  .coach-stat{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-bottom:8px;gap:6px}
  .coach-stat b{color:var(--ink);font-size:14px}
  .metro{position:relative;width:196px;height:196px;margin:8px auto 2px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--sev-critical-bg);border:3px solid var(--sev-critical);color:var(--sev-critical);transition:transform .08s ease;cursor:pointer;user-select:none}
  .metro.beat{transform:scale(1.07)}
  .metro.breaths{background:var(--sev-info-bg);border-color:var(--accent);color:var(--accent)}
  .metro .mnum{font-family:var(--font-mono);font-weight:600;font-size:62px;line-height:1}
  .metro .mlbl{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;margin-top:5px}
  .metro .msub{font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--font-sans);font-weight:500}
  .coach-tech{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:10px;font-size:13px;line-height:1.4}
  .coach-tech .row{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
  .coach-tech .row:first-child{border-top:0}
  .coach-tech .k{flex:0 0 52px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:2px}
  .coach-note{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.45;background:var(--sev-info-bg);border-radius:10px;padding:9px 11px}
  .coach-ctrls{display:flex;gap:9px;margin-top:12px}
  .coach-ctrls button{border:0;border-radius:13px;padding:14px;font-family:var(--font-sans);font-size:15px;font-weight:700;cursor:pointer}

{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"assess_casualty","title":"Assess a Casualty","audience":"public","category":"Core skills","version":"0.1","sourcePdf":"First Aid Algorithms/Evaluating the ill or injured.pdf; Evaluating the sick baby.pdf","lastReviewed":"2023","disclaimer":"First-aid guidance for the public. It does not replace professional medical care or a hands-on first-aid course. If in doubt, start chest compressions and call for help.","description":"The first thing to do for any collapsed or injured person: check danger, response, airway and breathing — in that order — then act on what you find. This is the gateway that sends you to CPR, the recovery position, or bleeding control.","contexts":[{"id":"age","type":"choice","label":"Who are you helping?","options":[{"id":"over1","label":"Adult or child (over 1 year)"},{"id":"baby","label":"Baby (under 1 year)"}],"default":"over1"}],"entry":"danger","nodes":{"danger":{"id":"danger","type":"observe","title":"Check for danger","severity":"info","body":["Quickly check the area is safe for you and for them","Remove the danger if you can, or move them only if you must — your safety comes first"],"next":"response"},"response":{"id":"response","type":"decision","title":"Check for a response","prompt":"Are they responding?","body":["Talk loudly: “Are you OK?”","Adult or child: tap or gently shake the shoulders","Look for eyes opening, movement, or any sound"],"contextBody":{"baby":["Talk loudly and gently squeeze the baby's shoulders, or tap the sole of a foot","See whether the baby opens their eyes, cries or moves"]},"branches":[{"label":"Yes — they respond","goto":"out_responsive","severity":"safe"},{"label":"No — no response","goto":"shout","severity":"critical"}]},"shout":{"id":"shout","type":"action","title":"Shout for help","severity":"severe","body":["Shout for help so someone can assist you","If a bystander is there, send them to call an ambulance — ask them to come back and confirm help is coming","If you are completely alone, do not leave them — call out while you keep working","They urgently need help"],"links":[{"label":"Call an ambulance","action":"call"}],"next":"airway"},"airway":{"id":"airway","type":"action","title":"Open the airway","severity":"severe","body":["Place one hand on the forehead and gently tilt the head back","Put two fingertips under the chin and lift it — don't press into the soft part under the chin","Look in the mouth; remove any blockage you can clearly see — do not sweep blindly"],"contextBody":{"baby":["Keep the baby's head in a NEUTRAL position — do not tilt it back","Gently lift the chin","Check the mouth for food, vomit or blood; pick out anything visible with your little finger","Never push your finger into the back of the throat"]},"media":{"type":"image","src":"media/ai_airway.png","alt":"Tilting the head back with one hand on the forehead and lifting the chin to open the airway","caption":"Tilt the head back with a hand on the forehead and lift the chin to open the airway."},"next":"breathing"},"breathing":{"id":"breathing","type":"decision","title":"Check for normal breathing","prompt":"Look, listen and feel — for no more than 10 seconds","body":["Look for the chest rising and falling","Listen for breathing sounds","Feel for breath on your cheek"],"warning":"In the first minutes after the heart stops, there may be occasional noisy gasps. These are NOT normal breathing — if you are unsure, treat it as 'not breathing'.","media":{"type":"image","src":"media/ai_breathing.png","alt":"Leaning over the casualty to look along the chest, listen and feel for breath","caption":"Look, listen and feel for normal breathing for no more than 10 seconds."},"branches":[{"label":"Breathing normally","goto":"out_recovery","severity":"caution"},{"label":"Not breathing / only gasping","goto":"out_cpr","severity":"critical"}]},"out_responsive":{"id":"out_responsive","type":"outcome","title":"They are responding","severity":"safe","body":["Leave them in the position you found them — do not move them unless they are in danger","Try to find out what is wrong and treat it","Check for and control any severe bleeding","Stay with them, get medical help if needed, and keep checking they don't get worse"],"links":[{"label":"Open Bleeding & Wounds guide","algorithm":"bleeding_wounds"},{"label":"Call an ambulance","action":"call"}]},"out_recovery":{"id":"out_recovery","type":"outcome","title":"Unconscious but breathing","severity":"caution","body":["Put them in the recovery position — but only if you do NOT suspect a neck or spine injury","If you do suspect a spinal injury, leave them as found while they are breathing normally","Check for and control any severe bleeding; keep checking their breathing"],"contextBody":{"baby":["Cradle the baby on their side, head tilted slightly downwards","Keep checking the baby's breathing and responses until help arrives","Be ready to start CPR again at any time"]},"links":[{"label":"Open Recovery Position guide","algorithm":"recovery_position"},{"label":"Open Bleeding & Wounds guide","algorithm":"bleeding_wounds"},{"label":"Call an ambulance","action":"call"}]},"out_cpr":{"id":"out_cpr","type":"outcome","title":"Not breathing — start CPR","severity":"critical","body":["Begin CPR straight away and make sure an ambulance is on the way"],"links":[{"label":"Open CPR guide","algorithm":"cpr"},{"label":"Call an ambulance","action":"call"}]}}}

{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"asthma","title":"Asthma Exacerbation","audience":"hcp","category":"Airway & Breathing","version":"1.0","sourcePdf":"Emergency Care Algorithms/Asthma Exacerbation Algorithm.pdf","lastReviewed":"2021","citation":"Global Initiative for Asthma. Global Strategy for Asthma Management and Prevention, 2021. www.ginasthma.org","disclaimer":"This clinical pathway supplements, but does not substitute for, professional judgment and may change with the patient's individual needs. Failure to comply does not represent a breach of the standard of care.","description":"Assessment and treatment of an acute asthma exacerbation, from initial actions through severity classification, treatment, reassessment and disposition.","contexts":[{"id":"weight","type":"number","label":"Patient weight","unit":"kg","placeholder":"e.g. 70"}],"entry":"initial","nodes":{"initial":{"id":"initial","type":"observe","title":"Acute asthmatic attack — initial actions","severity":"info","body":["Monitor and support ABCs","Start oxygen if SpO₂ < 92%; maintain SpO₂ ≥ 92% (give oxygen to all severe asthma, even with normal saturations)","Brief, targeted history and exam: auscultation, accessory-muscle use, PR, RR","Initiate treatment of the underlying cause of the exacerbation","Check Peak Expiratory Flow (PEF); record predicted or best PEF (%) in the notes"],"warning":"DO NOT measure PEF in patients with impending/actual respiratory arrest, drowsiness, confusion or silent chest — start treatment immediately.","refs":["measure_pef","pef_chart"],"next":"classify"},"classify":{"id":"classify","type":"decision","title":"Classify severity","prompt":"Assess the patient against the criteria and choose the matching severity.","branches":[{"label":"Drowsiness, confusion, or silent chest","detail":"Life-threatening — impending respiratory arrest","goto":"critical","severity":"critical"},{"label":"Severe","detail":"PEF ≤ 50% predicted/best · talks in words · sits hunched forward · agitated · SpO₂ < 90% · PR > 120","goto":"severe","severity":"severe"},{"label":"Mild or moderate","detail":"PEF > 50% predicted/best · talks in phrases · prefers sitting · not agitated · SpO₂ 90–95% · PR 100–120","goto":"mild_mod","severity":"caution"}]},"critical":{"id":"critical","type":"action","title":"Life-threatening asthma","severity":"critical","body":["Consider intubation (RSI with Ketamine if no contraindication) and ventilation with 100% oxygen; anticipate cardiovascular collapse post-intubation","Nebulise salbutamol + ipratropium every 20 min, or 3 doses over 1 hour (4 mL fill with NS, 6–8 L/min oxygen)","Get a chest X-ray"],"dosing":[{"drug":"Hydrocortisone IV","by":"weight","formula":{"perKg":2,"unit":"mg","max":200},"note":"give immediately"},{"drug":"Magnesium sulfate IV (high-dose)","fixed":"2 g in 5% dextrose over 20 min","note":""}],"refs":["dosing_table"],"links":[{"label":"Rapid Sequence Intubation","algorithm":"rsi_airway"}],"next":"admit"},"severe":{"id":"severe","type":"action","title":"Severe — treat","severity":"severe","body":["Nebulise salbutamol + ipratropium every 20 min, or 3 doses over 1 hour (4 mL fill with NS, 6–8 L/min oxygen)"],"dosing":[{"drug":"Hydrocortisone IV","by":"weight","formula":{"perKg":2,"unit":"mg","max":200},"note":"give immediately"}],"refs":["dosing_table"],"next":"reassess"},"mild_mod":{"id":"mild_mod","type":"action","title":"Mild / moderate — treat","severity":"caution","body":["Nebulise salbutamol + ipratropium every 20 min, or 3 doses over 1 hour (4 mL fill with NS, 6–8 L/min oxygen)","Give systemic corticosteroids immediately — oral if the patient can swallow, otherwise IV"],"dosing":[{"drug":"Prednisone PO","fixed":"40–80 mg/day in 1–2 doses","note":"preferred if patient can swallow"},{"drug":"Hydrocortisone IV","by":"weight","formula":{"perKg":2,"unit":"mg","max":200},"note":"if cannot tolerate oral"}],"refs":["dosing_table"],"next":"reassess"},"reassess":{"id":"reassess","type":"reassess","title":"Reassess hourly (or after every 3 doses)","severity":"info","body":["Reassess symptoms and physical exam","Re-check BP, PR, RR, SpO₂ and PEF"],"dosing":[{"drug":"Magnesium sulfate IV (high-dose)","fixed":"2 g in 5% dextrose over 20 min","note":"ONLY if PEF fails to reach > 60% predicted/personal best after 1 hour of treatment"}],"next":"disposition"},"disposition":{"id":"disposition","type":"decision","title":"Ready for discharge?","prompt":"Does the patient meet all discharge criteria?","branches":[{"label":"Yes — meets criteria","detail":"PEF 60–80% predicted/personal best · no distress · normal exam · response sustained 60 min after last treatment","goto":"discharge","severity":"safe"},{"label":"No — not yet","detail":"Continue treatment and reassess","goto":"reassess","severity":"caution"}]},"discharge":{"id":"discharge","type":"outcome","title":"Discharge home","severity":"safe","body":["Continue inhaled SABA — 2 puffs QID for 3–5 days","Review medication, including inhaler technique","Consider therapy for the underlying cause of the exacerbation","Refer to a chest physician for follow-up"],"dosing":[{"drug":"Dexamethasone (oral)","by":"weight","formula":{"perKg":0.6,"unit":"mg"},"note":"single dose — or 12 mg for adults"},{"drug":"Prednisone (alternative)","fixed":"40–60 mg/day, 5–10 day course","note":"see dosing table"}],"refs":["dosing_table"]},"admit":{"id":"admit","type":"outcome","title":"Admit to HDU / ICU","severity":"critical","body":["Continue nebulisation and corticosteroids","Senior / ICU review","Ongoing critical-care monitoring"]}},"references":{"dosing_table":{"id":"dosing_table","kind":"table","title":"Asthma medication doses","columns":["Medication","Dose","Comments"],"rows":[["Salbutamol — nebuliser","5 mg every 20 min ×3, then 2.5–10 mg q1–4h prn (or 10–15 mg/h continuous)","Dilute to ≥3 mL at 6–8 L/min. May mix with ipratropium."],["Salbutamol — pMDI (90 µg)","4–10 puffs every 20 min up to 4 h, then q1–4h prn","pMDI + spacer as effective as neb in mild–moderate with good technique."],["Ipratropium bromide — nebuliser (0.25 mg/mL)","0.5 mg every 20 min ×3, then prn","Add to SABA for severe. May mix with salbutamol. Not first-line alone."],["Ipratropium + salbutamol — nebuliser","3 mL every 20 min ×3, then prn","Up to 3 h in initial management of severe exacerbations."],["Prednisone","40–80 mg/day in 1–2 doses until PEF 70% of predicted/best","Outpatient burst 40–60 mg, total 5–10 days."],["Hydrocortisone","200 mg IV, then 1 mg/kg/dose IV QID","Only if patient cannot tolerate oral corticosteroids."],["Dexamethasone","0.6 mg/kg, or 12 mg (adult), single dose","No need to taper for short courses."]],"note":"ICS can be started at any point. For corticosteroid courses < 1 week there is no need to taper."},"measure_pef":{"id":"measure_pef","kind":"procedure","title":"How to measure Peak Expiratory Flow (PEF)","warning":"DO NOT measure PEF in patients with impending/actual respiratory arrest, drowsiness, confusion or silent chest. Start treatment immediately.","steps":["Set the pointer on the gauge to 0 (or the lowest number)","Attach the mouthpiece to the peak flow meter","While standing, take a deep breath","Close the lips tightly around the mouthpiece (keep the tongue out of the way)","Blow out as hard and as fast as possible for 1–2 seconds","Read the gauge and write the number down","Repeat 3 times and take the best PEF","Plot the best PEF on the normal-values chart; % = measured ÷ normal × 100 (also in MDCalc)","Record the PEF in the patient's clinical notes"]},"pef_chart":{"id":"pef_chart","kind":"image","title":"PEF normal values (EN 13826 / EU scale)","src":"media/pef_chart.svg","alt":"Peak expiratory flow normal-value curves for men and women by age and height"}}}

<script type="application/json" id="algo-bleeding_wounds">
{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"bleeding_wounds","title":"Bleeding & Wounds","audience":"public","category":"Bleeding & wounds","version":"0.1","sourcePdf":"First Aid Algorithms/Severe Bleeding.pdf; Skin Wounds.pdf","lastReviewed":"2023","disclaimer":"First-aid guidance for the public. It does not replace professional medical care. If in doubt, call for help.","description":"Covers wounds and bleeding from a minor cut or graze, through severe external bleeding that needs firm pressure, to suspected internal bleeding. Heavy bleeding can kill quickly — controlling it comes before everything else. (Consolidates the Severe Bleeding and Skin Wounds guides.)","entry":"assess","nodes":{"assess":{"id":"assess","type":"decision","title":"What are you dealing with?","prompt":"Choose what best describes it.","body":["Protect yourself from their blood first — put on gloves or cover your hands with clean plastic bags"],"branches":[{"label":"Heavy bleeding — blood pouring or spurting from a wound","goto":"check_object","severity":"critical"},{"label":"A minor cut, graze or wound that isn't bleeding much","goto":"minor_clean","severity":"safe"},{"label":"No obvious wound, but signs of bleeding inside the body","goto":"internal","severity":"severe"}]},"check_object":{"id":"check_object","type":"decision","title":"Is anything stuck in the wound?","prompt":"Check the wound (without poking it).","branches":[{"label":"No object in the wound","goto":"severe_pressure","severity":"critical"},{"label":"Yes — an object is embedded in the wound","goto":"embedded","severity":"severe"}]},"severe_pressure":{"id":"severe_pressure","type":"action","title":"Press hard to stop the bleeding","severity":"critical","body":["Get help / call an ambulance","If they are conscious, ask them to press on the wound themselves while you get ready","Help them lie down in a comfortable position","Using a clean cloth, press firmly on the wound with both hands — if it keeps bleeding, press harder","Keep pressing until medical help arrives","Wrap a bandage over the cloth firmly, but not so tight it cuts off circulation","If blood soaks through, add another bandage on top and keep pressing"],"warning":"If the limb below the bandage swells, changes colour or goes numb, loosen the bandage a little — but never remove it, or the bleeding restarts.","donts":["Do not remove a bandage once it is on — add another on top","Do not use a tourniquet or a very tight bandage on a limb — the limb can be lost","Do not raise the person's legs"],"media":{"type":"image","src":"media/bld_pressure.png","alt":"Kneeling beside a lying person and pressing firmly on the wound with both hands","caption":"Press firmly on the wound with both hands and keep pressing until help arrives."},"links":[{"label":"Call an ambulance","action":"call"}],"next":"shock_prevent"},"embedded":{"id":"embedded","type":"action","title":"Object stuck in the wound","severity":"severe","body":["Get help / call an ambulance","Try to stop or slow the bleeding by pressing AROUND the wound, not on the object","Build up padding with dressings on both sides of the object","Bandage over the padding without pressing down on the object","Take off any jewellery near the wound in case the area swells"],"donts":["Do not remove the embedded object — the bleeding will get worse","Do not push the object deeper","Do not press directly on the object"],"media":{"type":"image","src":"media/bld_embedded.png","alt":"Building up padding on both sides of an object embedded in a wound and bandaging over it","caption":"Pad on both sides of the object and bandage over it — never press on it or pull it out."},"links":[{"label":"Call an ambulance","action":"call"}],"next":"shock_prevent"},"shock_prevent":{"id":"shock_prevent","type":"action","title":"Keep them warm and watch them","severity":"severe","body":["Heavy blood loss can lead to shock — remove wet clothing, cover them with a blanket and keep them warm (but don't overheat them)","If you are alone, arrange urgent transport to medical care yourself","Stay with them and keep checking their consciousness and breathing"],"media":{"type":"image","src":"media/bld_keepwarm.png","alt":"An injured person lying down covered with a blanket to keep warm","caption":"Remove wet clothing and cover them with a blanket to keep them warm."},"links":[{"label":"Open Shock guide","algorithm":"shock"},{"label":"Call an ambulance","action":"call"}],"next":"out_monitor"},"out_monitor":{"id":"out_monitor","type":"outcome","title":"Stay with them until help arrives","severity":"severe","body":["Keep pressure on the wound and keep them warm","Keep checking their breathing — if it stops, start CPR straight away"],"links":[{"label":"Open CPR guide","algorithm":"cpr"},{"label":"Call an ambulance","action":"call"}]},"minor_clean":{"id":"minor_clean","type":"action","title":"Clean and cover the wound","severity":"caution","body":["Wash your hands; wear gloves or clean plastic bags","Rinse the wound by pouring clean water over it; gently lift out any dirt with wet gauze or a clean cloth","Cover it with a clean dressing or plaster to keep germs and dirt out","Keep the wound dry and keep flies off it","Rinse and change the dressing every 2–3 days (every day if it looks infected)","To remove a stuck dressing, wet it first so it lifts off without tearing the healing skin"],"warning":"If a wound is bleeding heavily, do NOT waste time cleaning it — control the bleeding first (go back and choose 'Heavy bleeding').","donts":["Do not try to close a dirty wound","Do not tear off a stuck dressing — wet it first"],"media":{"type":"image","src":"media/bld_clean.png","alt":"Rinsing a wound by pouring clean water over it","caption":"Rinse the wound by pouring clean water over it before covering."},"next":"minor_seek"},"minor_seek":{"id":"minor_seek","type":"decision","title":"Does this wound need medical help?","prompt":"Is any of these true?","branches":[{"label":"Bleeding won't stop · object stuck · gaping or bigger than half a hand · loss of feeling/movement · on the face/eyes/genitals · very dirty · a bite · diabetes/immune problems · 65+ · tetanus jab over 10 years ago (or unsure)","goto":"out_seek_wound","severity":"caution"},{"label":"None of these — a small, clean wound","goto":"out_watch","severity":"safe"}]},"out_watch":{"id":"out_watch","type":"outcome","title":"Care for it at home","severity":"safe","body":["Most cuts and grazes heal well at home","Over the next days, watch for infection: pain that gets worse, fever or feeling unwell, or skin around the wound that is swollen, hot or red","Get medical help if any of those appear"]},"out_seek_wound":{"id":"out_seek_wound","type":"outcome","title":"Get medical help","severity":"caution","body":["Have the wound seen by a health worker — ideally within 6 hours","A tetanus injection may be needed; even small wounds can cause tetanus, and the injection is very safe","Keep watching for signs of infection afterwards"],"links":[{"label":"Call an ambulance","action":"call"}]},"internal":{"id":"internal","type":"action","title":"Suspected internal bleeding","severity":"severe","body":["Suspect bleeding inside the body if the person: is bleeding from a body opening; is breathing fast; has cold, clammy, pale or bluish skin; is behaving oddly or irritably; or becomes sleepy or unconscious","Get urgent help — this is an emergency you cannot treat directly","Keep them warm to help prevent shock","Stay calm and reassure them","Keep checking their consciousness and breathing"],"links":[{"label":"Call an ambulance","action":"call"},{"label":"Open Shock guide","algorithm":"shock"}],"next":"out_monitor"}}}
</script>
<script type="application/json" id="algo-bone_joint_muscle">
{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"bone_joint_muscle","title":"Bone, Joint & Muscle Injury","audience":"public","category":"Bones, joints & muscles","version":"0.1","sourcePdf":"First Aid Algorithms/Fractures and Dislocations.pdf; Sprain.pdf","lastReviewed":"2023","disclaimer":"First-aid guidance for the public. It does not replace professional medical care. If in doubt, call for help.","description":"For limb injuries — a suspected broken bone or dislocated joint, or a sprain or strain. The first aid is similar for both; if you can't tell which it is, treat it as the more serious injury. (Consolidates the Fractures & Dislocations and Sprain guides.)","entry":"recognise","nodes":{"recognise":{"id":"recognise","type":"observe","title":"Look at the injury","severity":"info","body":["First check the person is conscious and breathing normally","Pain in the injured limb or joint","Possibly an abnormal shape or position","Swelling or discolouration","Difficulty moving the injured part","If there is a wound over the injury, possibly with bone showing, it is an 'open' fracture or dislocation"],"next":"type"},"type":{"id":"type","type":"decision","title":"What kind of injury is it?","prompt":"If you are not sure, treat it as a possible break — the safer choice.","branches":[{"label":"Possible broken bone or dislocation — severe pain, deformed, can't use it, or an open wound over it","goto":"break_care","severity":"severe"},{"label":"Looks like a sprain or strain — a twisted, painful, swollen joint","goto":"sprain_care","severity":"caution"}]},"break_care":{"id":"break_care","type":"action","title":"Care for a suspected break or dislocation","severity":"severe","body":["Tell them to keep the injured limb still","If you suspect a broken leg, do not let them stand on it","Take off jewellery near the injury before the area swells","If it is an open fracture, gently press around the wound to stop bleeding and cover it with a clean dressing","Call for help and arrange urgent transport for an open fracture, a deformed limb, or any lower-limb injury","If help will take a while, you can support the limb: splint a leg to the other leg, or put an injured arm in a sling"],"donts":["Do not try to straighten or push back a crooked or dislocated limb — you can make it worse","Do not move the injured limb more than you must","Do not splint or immobilise if an ambulance will arrive soon — they have proper equipment","Do not cool an open fracture or dislocation"],"media":{"type":"image","src":"media/bjm_sling.png","alt":"An injured arm supported in a sling across the body","caption":"If help is delayed, support an injured arm in a sling (here improvised from clothing)."},"refs":["immobilise_leg","immobilise_arm"],"links":[{"label":"Call an ambulance","action":"call"}],"next":"cool"},"sprain_care":{"id":"sprain_care","type":"action","title":"Care for a sprain or strain","severity":"caution","body":["Tell them to keep the injured joint still","Take off jewellery near the injury before it swells","If it is a foot or ankle, have them take their own shoe off","You can support a sprained ankle with a bandage"],"donts":["Do not massage the injury"],"media":{"type":"image","src":"media/bjm_ankle.png","alt":"Wrapping a support bandage diagonally across the foot in a figure-of-eight","caption":"Support a sprained ankle with a figure-of-eight bandage — leave the toes uncovered."},"refs":["bandage_ankle"],"next":"cool"},"cool":{"id":"cool","type":"action","title":"Cool the injury","severity":"caution","body":["Wrap ice in a cloth or towel and hold it on the injury to ease swelling and pain","No ice? Use cold water instead","Cool it for as long as they can comfortably tolerate — but no longer than 20 minutes"],"timer":{"label":"Cool the injury — no longer than 20 minutes","durationSec":1200,"kind":"countdown"},"warning":"Do NOT cool an open fracture or dislocation (a wound with possible bone showing).","next":"seek"},"seek":{"id":"seek","type":"decision","title":"Does it need urgent care?","prompt":"How serious does it look now?","branches":[{"label":"Open wound or bone showing, a leg injury, a clearly deformed limb, or pain that won't ease","goto":"out_urgent","severity":"severe"},{"label":"A milder sprain — pain eases with cooling and they can use the joint","goto":"out_home","severity":"safe"}]},"out_urgent":{"id":"out_urgent","type":"outcome","title":"Get medical attention","severity":"severe","body":["Always have a suspected broken bone or dislocation checked by a health worker","If urgent transport is needed, stay with them until help arrives","Keep checking their consciousness and breathing every minute"],"links":[{"label":"Call an ambulance","action":"call"}]},"out_home":{"id":"out_home","type":"outcome","title":"Rest it and watch it","severity":"safe","body":["Rest the injured joint and avoid using it","Get medical attention if the pain does not fade after cooling, or they still cannot use the joint"]}},"references":{"immobilise_leg":{"id":"immobilise_leg","kind":"procedure","title":"Technique: Immobilising a leg","warning":"Don't tie the bandages too tight. If the toes go cold and greyish, loosen the splint.","steps":["If only one leg is hurt, splint it to the good leg: carefully move the good leg alongside the injured one","Slide 4 bandages or strips of cloth under the knees","Move them into place: one at the thighs, one at the ankles, one just above the knees, one just below the knees","Pad the hollow between the legs (e.g. a rolled blanket), then tie the legs together","If both legs are hurt, splint each separately against a straight, firm object (a branch, pole or stick) tied to the outer side of the leg"]},"immobilise_arm":{"id":"immobilise_arm","kind":"procedure","title":"Technique: Immobilising an arm (sling)","steps":["If they can, let them simply hold the injured arm against their body","With a triangular bandage: have them support the arm at a right angle across the body","Place the bandage under the arm, point towards the elbow, long edge upright","Bring the lower end up over the arm and tie both ends at the side of the neck; fingertips should stay visible","Fold and pin the fabric at the elbow","No triangular bandage? Turn up the lower edge of their shirt and pin it to form a sling"]},"bandage_ankle":{"id":"bandage_ankle","kind":"procedure","title":"Technique: Bandaging a sprained ankle","warning":"Don't bandage too tight. If the toes go cold and greyish, loosen it.","steps":["Ask them to hold the foot in a neutral position","Start with a turn just above the ankle, at a slight angle; fold back the tip and cover it with the next turn","Bring the bandage diagonally across the top of the foot towards the toes","Make one turn around the toes — but leave the toes uncovered so movement and colour can be checked","Cross back over the top of the foot to the start, behind the ankle, and back to the toes","Repeat these figure-of-eight turns, each a little nearer the ankle","Finish with two turns around the ankle and fasten with tape or a clip"]}}}
</script>
<script type="application/json" id="algo-choking">
{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"choking","title":"Choking","audience":"public","category":"Life-threatening","version":"1.0","sourcePdf":"First Aid Algorithms/Choking.pdf","lastReviewed":"2023","disclaimer":"First-aid guidance for the public. It does not replace professional medical care. If in doubt, call for help.","description":"Choking happens when a foreign object blocks the throat and breathing becomes difficult or stops. Children often choke on small objects; most adult cases happen while eating.","contexts":[{"id":"age","type":"choice","label":"Who is choking?","options":[{"id":"over1","label":"Adult or child (over 1 year)"},{"id":"baby","label":"Baby (under 1 year)"}],"default":"over1"}],"entry":"recognise","nodes":{"recognise":{"id":"recognise","type":"observe","title":"Recognise choking","severity":"info","body":["The person is trying to cough something up","They cannot speak or make any sound","They clutch their throat","Lips and tongue start to turn blue","Veins in the face and neck stick out","They become dizzy and may lose consciousness"],"next":"ask"},"ask":{"id":"ask","type":"decision","title":"Ask: “Are you choking?”","prompt":"Can they cough, speak or breathe?","branches":[{"label":"Yes — they can cough or breathe","goto":"encourage","severity":"safe"},{"label":"No — silent, cannot breathe","goto":"back_blows","severity":"severe"}]},"encourage":{"id":"encourage","type":"action","title":"Encourage them to keep coughing","severity":"safe","body":["Tell them to keep coughing","Do not do anything else — do not hit the back or give thrusts","Stay with them until they breathe normally again"],"next":"watch"},"watch":{"id":"watch","type":"decision","title":"Keep watching","prompt":"How are they now?","branches":[{"label":"Breathing normally again","goto":"out_recovered","severity":"safe"},{"label":"Getting worse — cannot cough or breathe","goto":"back_blows","severity":"severe"}]},"back_blows":{"id":"back_blows","type":"action","title":"Give 5 blows to the back","severity":"severe","body":["Stand to the side and slightly behind them","Support the chest with one hand and bend them well forward","Give up to 5 sharp blows between the shoulder blades with the heel of your hand","Check after each blow — stop as soon as the object comes out"],"contextBody":{"baby":["Lay the baby face down along your forearm, head low","Support the head and give up to 5 firm blows on the back with the heel of your hand","Check after each blow — stop as soon as the object comes out"]},"media":{"type":"image","src":"media/back_blows.png","alt":"Giving back blows to a person bent forward","caption":"Support the chest, bend forward, strike between the shoulder blades."},"refs":["back_blows"],"next":"check1"},"check1":{"id":"check1","type":"decision","title":"Did the object come out?","prompt":"Can they speak, cough or breathe now?","branches":[{"label":"Yes — it cleared","goto":"out_cleared","severity":"safe"},{"label":"No — still choking","goto":"abd_thrusts","severity":"severe"}]},"abd_thrusts":{"id":"abd_thrusts","type":"action","title":"Give 5 abdominal thrusts","severity":"severe","body":["Stand behind them and wrap both arms around the waist","Make a fist and place it between the belly button and the lower tip of the breastbone","Grip your fist with the other hand","Bend them forward and pull sharply inwards and upwards — up to 5 times"],"contextBody":{"baby":["Use CHEST thrusts, not abdominal thrusts","Place two fingers in the middle of the chest","Push sharply inwards and upwards towards the head — up to 5 times"]},"media":{"type":"image","src":"media/abdominal_thrusts.png","alt":"Giving abdominal thrusts from behind","caption":"Fist above the navel, grip with the other hand, pull in and up."},"warning":"Abdominal and chest thrusts can cause internal injuries. Anyone given thrusts must be seen by a doctor afterwards.","refs":["abd_thrusts"],"next":"check2"},"check2":{"id":"check2","type":"decision","title":"Did the object come out?","prompt":"Can they speak, cough or breathe now?","branches":[{"label":"Yes — it cleared","goto":"out_cleared","severity":"safe"},{"label":"No — still choking","goto":"still_conscious","severity":"severe"}]},"still_conscious":{"id":"still_conscious","type":"decision","title":"Are they still conscious?","prompt":"Are they still awake and responding?","branches":[{"label":"Yes — keep going","goto":"alternate","severity":"severe"},{"label":"No — they have collapsed","goto":"collapsed","severity":"critical"}]},"alternate":{"id":"alternate","type":"action","title":"Alternate back blows and thrusts","severity":"severe","body":["Keep switching between 5 back blows and 5 abdominal thrusts","Check after each set","Send someone to call for an ambulance now if you have not already"],"links":[{"label":"Call an ambulance","action":"call"}],"next":"check2"},"collapsed":{"id":"collapsed","type":"action","title":"If they lose consciousness","severity":"critical","body":["Carefully lower them to the ground","Call for help / an ambulance immediately","Check whether they are breathing"],"links":[{"label":"Call an ambulance","action":"call"}],"next":"breathing"},"breathing":{"id":"breathing","type":"decision","title":"Are they breathing?","prompt":"Look, listen and feel for normal breathing","branches":[{"label":"No — not breathing","goto":"out_cpr","severity":"critical"},{"label":"Yes — breathing","goto":"out_recovery","severity":"caution"}]},"out_recovered":{"id":"out_recovered","type":"outcome","title":"They have recovered","severity":"safe","body":["Stay with them until you are sure they are well","Seek medical advice if anything seems wrong"]},"out_cleared":{"id":"out_cleared","type":"outcome","title":"The object has cleared","severity":"safe","body":["Stay with them and watch their breathing","If abdominal or chest thrusts were used, they MUST be checked by a doctor"]},"out_cpr":{"id":"out_cpr","type":"outcome","title":"Start CPR now","severity":"critical","body":["Begin chest compressions immediately and continue until help arrives"],"links":[{"label":"Open CPR guide","algorithm":"cpr"},{"label":"Call an ambulance","action":"call"}]},"out_recovery":{"id":"out_recovery","type":"outcome","title":"Place in the recovery position","severity":"caution","body":["Roll them onto their side, head tilted back so the airway stays open","Keep watching their breathing until help arrives"],"links":[{"label":"Open Recovery Position guide","algorithm":"recovery_position"},{"label":"Call an ambulance","action":"call"}]}},"references":{"back_blows":{"id":"back_blows","kind":"procedure","title":"Technique: Blows to the back","variants":{"over1":{"label":"Adult or child (over 1 year)","steps":["Stand to the side and a little behind the person","Support the chest with one hand and bend them well forward, so a dislodged object falls out rather than deeper in","Give up to 5 sharp blows between the shoulder blades with the heel of your hand","Check after each blow whether the object has come out"],"media":{"type":"image","src":"media/back_blows.png","alt":"Back blows on a person bent forward"}},"baby":{"label":"Baby (under 1 year)","steps":["Lay the baby face down along your forearm with the head low","Support the head and jaw with your hand","Give up to 5 firm blows on the back with the heel of your hand"],"media":{"type":"image","src":"media/baby_back_blows.png","alt":"Back blows on a baby along the forearm"}}}},"abd_thrusts":{"id":"abd_thrusts","kind":"procedure","title":"Technique: Abdominal / chest thrusts","warning":"Thrusts can cause serious internal injuries. Anyone given thrusts must be seen by a doctor.","variants":{"over1":{"label":"Adult or child (over 1 year) — abdominal thrusts","steps":["Stand behind the person and wrap both arms around the waist","Make a fist and place it between the belly button and the lower tip of the breastbone","Place the other hand on top, gripping the back of your fist and wrist","Bend the person forward and pull strongly towards you and upwards"],"media":{"type":"image","src":"media/abdominal_thrusts.png","alt":"Abdominal thrusts from behind"}},"baby":{"label":"Baby (under 1 year) — chest thrusts","steps":["Place two fingers in the middle of the chest","Push sharply inwards and upwards towards the head","Give up to 5 chest thrusts, checking after each"],"media":{"type":"image","src":"media/baby_thrusts.png","alt":"Chest thrusts on a baby"}}}}}}
</script>
<script type="application/json" id="algo-cpr">
{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"cpr","title":"CPR","audience":"public","category":"Life-threatening","version":"0.2","sourcePdf":"First Aid Algorithms/CPR in Babies.pdf; CPR in Children.pdf; CPR-for-babies-under-12-months.pdf; First Aid for First Responders in Africa (pp. 49–52)","lastReviewed":"2023","disclaimer":"First-aid guidance for the public. It does not replace professional medical care or a hands-on CPR course. If in doubt, start chest compressions and call for help. Illustrative draft — not yet clinically reviewed by EMK.","description":"What to do when someone collapses and may not be breathing: check for danger, response and breathing, then give CPR. The guide adapts to an adult, a child (1 year to puberty) or a baby (under 1 year), and the coach keeps the compression rhythm for you.","contexts":[{"id":"age","type":"choice","label":"Who needs help?","options":[{"id":"adult","label":"Adult (from puberty)"},{"id":"child","label":"Child (1 yr – puberty)"},{"id":"baby","label":"Baby (under 1 yr)"}],"default":"adult"}],"entry":"danger","nodes":{"danger":{"id":"danger","type":"observe","title":"Check for danger","severity":"info","body":["Quickly check the area is safe for you and for them","Remove the danger if you can, or move them only if you must","Your own safety comes first — you cannot help if you are hurt too"],"contextMedia":{"baby":{"type":"image","src":"media/cpr_drs_danger.png","alt":"Rescuer checking the area around a baby for danger"}},"next":"response"},"response":{"id":"response","type":"decision","title":"Check for a response","prompt":"Are they responding?","body":["Talk loudly: “Are you OK?”","Adult or child: tap or gently shake the shoulders","Baby: tap the sole of the foot or gently squeeze a shoulder","Look for eyes opening, movement, crying or any sound"],"contextMedia":{"baby":{"type":"image","src":"media/cpr_drs_response.png","alt":"Rescuer checking a baby for a response"}},"branches":[{"label":"Yes — they respond","goto":"out_responsive","severity":"safe"},{"label":"No — no response","goto":"shout","severity":"critical"}]},"shout":{"id":"shout","type":"action","title":"Shout for help and call an ambulance","severity":"severe","body":["Shout for help so someone can assist you","Call for an ambulance now — put your phone on speaker so your hands are free","Send someone to find an AED (defibrillator) if one is nearby"],"contextBody":{"child":["Shout for help","If someone is with you, send them to call an ambulance and bring an AED","If you are completely alone, give 1 minute of CPR first, then call"],"baby":["Shout for help","If someone is with you, send them to call an ambulance and bring an AED","If you are completely alone, give 1 minute of CPR first, then call"]},"contextMedia":{"baby":{"type":"image","src":"media/cpr_drs_send.png","alt":"Call an ambulance"}},"links":[{"label":"Call an ambulance","action":"call"}],"next":"airway"},"airway":{"id":"airway","type":"action","title":"Open the airway","severity":"severe","body":["Place one hand on the forehead and gently tilt the head back","Lift the chin with two fingertips","Look in the mouth and remove any blockage you can clearly see — do not sweep blindly"],"contextBody":{"baby":["Keep the head in a NEUTRAL position — do not tilt it back","Gently lift the chin","Look in the mouth and pick out anything visible with your little finger","Never push your finger blindly into the back of the throat"]},"contextMedia":{"baby":{"type":"image","src":"media/cpr_drs_airway.png","alt":"Checking and clearing a baby's airway"}},"next":"breathing"},"breathing":{"id":"breathing","type":"decision","title":"Check for normal breathing","prompt":"Look, listen and feel — for no more than 10 seconds","body":["Look for the chest rising and falling","Listen for breathing sounds","Feel for breath on your cheek"],"warning":"Occasional gasps or noisy, irregular breaths are NOT normal breathing — treat them as ‘not breathing’ and start CPR.","contextMedia":{"baby":{"type":"image","src":"media/cpr_drs_breathing.png","alt":"Checking a baby for normal breathing"}},"branches":[{"label":"Breathing normally","goto":"out_recovery","severity":"caution"},{"label":"Not breathing / only gasping","goto":"cpr","severity":"critical"}]},"cpr":{"id":"cpr","type":"cpr","title":"Give CPR","severity":"critical","coach":{"rate":110,"compressions":30,"breaths":2,"initialBreaths":0,"depth":"5–6 cm (about one third of the chest)","hands":"Heel of one hand on the centre of the chest, other hand on top, fingers interlocked, arms straight","breathsNote":"If you have a face shield or pocket mask, give 2 breaths after every 30 compressions. No barrier device? Hands-only compressions are fine — do not stop."},"contextCoach":{"child":{"initialBreaths":5,"depth":"about one third of the chest (no more than 6 cm)","hands":"One or two hands on the centre of the chest — whatever reaches the right depth","breathsNote":"Start with 5 rescue breaths, then give 2 breaths after every 30 compressions."},"baby":{"initialBreaths":5,"depth":"about one third of the chest","hands":"Lay the baby on a firm surface. Two fingers (index and middle) on the centre of the chest, between the nipples; rest your other hand on the forehead","breathsNote":"Start with 5 rescue breaths, then give 2 breaths after every 30 compressions. Seal your mouth over the baby's mouth AND nose; blow gently for 1 second and watch the chest rise. Make up to 5 attempts to get 2 effective breaths."}},"media":{"type":"image","src":"media/cpr_adult_compress.png","alt":"Two interlocked hands giving chest compressions to an adult"},"contextMedia":{"child":{"type":"image","src":"media/cpr_child_compress.png","alt":"Giving chest compressions to a child"},"baby":{"type":"image","src":"media/cpr_baby_compress.png","alt":"Two-finger chest compressions on a baby"}},"refs":["rescue_breaths","hand_placement","aed"],"links":[{"label":"Call an ambulance","action":"call"}],"next":"signs"},"signs":{"id":"signs","type":"decision","title":"Any signs of life?","prompt":"Only stop to check if they seem to wake, move or breathe normally.","body":["Do not interrupt compressions to recheck unless there are clear signs of life","Swap with another helper about every 2 minutes if you can, so you don't tire","If an AED arrives, switch it on and follow its spoken instructions"],"refs":["aed"],"branches":[{"label":"Yes — signs of life","goto":"out_recovery","severity":"safe"},{"label":"No — still not breathing","goto":"cpr","severity":"critical"}]},"out_responsive":{"id":"out_responsive","type":"outcome","title":"They are responding","severity":"safe","body":["They do not need CPR right now","Check for and control any serious bleeding or injuries","Stay with them and keep watching their breathing","Get medical help if you are worried or they get worse"],"links":[{"label":"Call an ambulance","action":"call"}]},"out_recovery":{"id":"out_recovery","type":"outcome","title":"Put them in the recovery position","severity":"caution","body":["Roll them onto their side","Tilt the head back so the airway stays open","Keep checking their breathing — be ready to start CPR again if it stops"],"contextBody":{"baby":["Cradle the baby on their side in your arms, head tilted slightly downwards","Keep checking their breathing and responsiveness","Be ready to start CPR again at any time"]},"contextMedia":{"baby":{"type":"image","src":"media/cpr_recovery.png","alt":"Holding a baby on their side in the recovery position"}},"links":[{"label":"Open Recovery Position guide","algorithm":"recovery_position"},{"label":"Call an ambulance","action":"call"}]}},"references":{"rescue_breaths":{"id":"rescue_breaths","kind":"procedure","title":"Technique: Rescue breaths","warning":"Never delay or stop chest compressions to find a barrier device. If you have none and won't give breaths, do continuous compressions only.","variants":{"adult":{"label":"Adult — with a barrier device","steps":["Use a face shield or pocket mask if you have one","Tilt the head back and lift the chin to open the airway","Pinch the soft part of the nose closed","Take a normal breath and seal your lips around their mouth (or the mask)","Blow steadily for about 1 second — just enough to make the chest rise","Give 2 breaths after every 30 compressions"],"media":{"type":"image","src":"media/cpr_adult_breaths.png","alt":"Giving a rescue breath to an adult using a pocket mask"}},"child":{"label":"Child (1 yr – puberty)","steps":["Tilt the head back and lift the chin","Pinch the nose closed","Take a breath and seal your lips around their mouth","Blow gently for about 1 second until the chest rises","Give 5 breaths to begin, then 2 after every 30 compressions","Make up to 5 attempts to achieve 2 effective breaths"]},"baby":{"label":"Baby (under 1 yr)","steps":["Keep the head in a NEUTRAL position — do not tilt it back","If the head won't stay neutral, put a rolled-up towel under the baby's upper body","Do NOT pinch the nose","Seal your mouth over the baby's mouth AND nose","Blow gently for about 1 second — just enough to see the chest rise","Give 5 breaths to begin, then 2 after every 30 compressions","Make up to 5 attempts to achieve 2 effective breaths","If the chest doesn't rise: recheck the mouth for blockages and the head position"],"media":{"type":"image","src":"media/cpr_baby_head.png","alt":"Baby head positions: tilted too far back and forward are wrong; neutral is correct"}}}},"hand_placement":{"id":"hand_placement","kind":"procedure","title":"Technique: Hand position & compressions","variants":{"adult":{"label":"Adult","steps":["Kneel beside them","Put the heel of one hand on the centre of the chest (lower half of the breastbone)","Place your other hand on top and interlock your fingers","Keep your arms straight, shoulders directly over your hands","Press down 5–6 cm, then let the chest come all the way back up","Push hard and fast — about 2 presses every second"],"media":{"type":"image","src":"media/cpr_adult_compress.png","alt":"Two interlocked hands on the centre of an adult's chest"}},"child":{"label":"Child (1 yr – puberty)","steps":["Put the heel of one hand on the centre of the chest","Use one or two hands — whatever you need to press about one third of the chest depth","For a larger child, or a small rescuer, use both hands with the fingers hooked together","Keep your arm(s) straight; press and release fully","About 2 presses every second (100–120 per minute)"],"media":{"type":"image","src":"media/cpr_child_compress.png","alt":"Giving chest compressions to a child"}},"baby":{"label":"Baby (under 1 yr)","steps":["Put two fingers (index and middle) on the centre of the chest, just below the nipple line","Press straight down about one third of the chest depth","Let the chest come all the way back up between presses","About 2 presses every second (100–120 per minute)"],"media":{"type":"image","src":"media/cpr_baby_compress.png","alt":"Two-finger chest compressions on a baby"}}}},"aed":{"id":"aed","kind":"procedure","title":"Using an AED (defibrillator)","warning":"Don't delay or stop CPR to look for an AED — send someone else. Keep doing compressions until it is switched on and ready.","steps":["Switch the AED on as soon as it arrives and follow its spoken instructions","Bare the chest and wipe it dry","Stick the pads on as shown on each pad: one upper-right below the collarbone, one on the left side below the armpit","Make sure nobody is touching them, then let the AED check the heart","If it advises a shock: make sure everyone is clear, then press the flashing button","Carry on with CPR straight away, following the AED's prompts"],"note":"An AED is safe for untrained people — it will not deliver a shock to someone who doesn't need one."}}}
</script>
<script type="application/json" id="algo-dehydration">
{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"dehydration","title":"Dehydration","audience":"public","category":"Sudden illness","version":"0.1","sourcePdf":"First Aid Algorithms/Dehydration.pdf","lastReviewed":"2023","disclaimer":"First-aid guidance for the public. It does not replace professional medical care. If in doubt, call for help.","description":"Dehydration is a shortage of body fluids — when more fluid is lost (through sweating, vomiting or diarrhoea, or in hot weather) than is taken in. It is especially dangerous in babies and young children.","entry":"recognise","nodes":{"recognise":{"id":"recognise","type":"observe","title":"Signs of dehydration","severity":"info","body":["Thirsty, with a dry mouth","Passing less urine, or darker urine","Feeling weak and unwell; headache","Skin is less springy — pinch the skin on the arm; if it takes more than a second or two to spring back, suspect dehydration","A baby crying without tears, or with dry nappies for longer than usual"],"refs":["ors"],"next":"care"},"care":{"id":"care","type":"action","title":"Replace the fluids","severity":"caution","body":["Give plenty to drink — clean water, or an oral rehydration solution (ORS)","For a breastfed baby, keep breastfeeding, more often than usual","For a bottle-fed baby, continue normal feeds and add extra rehydration drinks","Rest in a cool place and treat the cause of the fluid loss (diarrhoea, vomiting, heat)"],"media":{"type":"image","src":"media/de_ors.png","alt":"Ingredients for a home-made oral rehydration solution: a litre of clean water and maize flour","caption":"Make a home-made ORS: 2 fistfuls of maize flour to 1 litre of clean water, plus 2 pinches of salt."},"refs":["ors"],"next":"seek"},"seek":{"id":"seek","type":"decision","title":"Is it severe or getting worse?","prompt":"Any of these?","branches":[{"label":"Very weak, can't keep fluids down, very drowsy or confused, sunken eyes, a baby too weak to feed — or no improvement","goto":"out_seek","severity":"severe"},{"label":"Mild — drinking and starting to improve","goto":"out_home","severity":"safe"}]},"out_home":{"id":"out_home","type":"outcome","title":"Keep them drinking","severity":"safe","body":["Keep giving fluids regularly until they recover","Keep watching — get help if they get worse"]},"out_seek":{"id":"out_seek","type":"outcome","title":"Get medical help","severity":"severe","body":["Severe dehydration needs medical care, especially in babies and young children","Keep giving small sips on the way to help"],"links":[{"label":"Call an ambulance","action":"call"}]}},"references":{"ors":{"id":"ors","kind":"procedure","title":"Technique: Home-made rehydration drink (ORS)","warning":"Wash your hands before preparing it.","steps":["Maize ORS: mix 60 g maize flour (about 2 fistfuls) with 1 litre of clean water","Add 2 pinches of salt and mix well","Cook over a fire, stirring all the time, until it boils — then cool before giving","Rice ORS (alternative): use 60 g rice powder (about 2 fistfuls) instead of maize flour; otherwise the same steps"]}}}
</script>
<script type="application/json" id="algo-drowning">
{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"drowning","title":"Drowning","audience":"public","category":"Environmental","version":"0.1","sourcePdf":"First Aid Algorithms/Drowning.pdf","lastReviewed":"2023","disclaimer":"First-aid guidance for the public. It does not replace professional medical care. If in doubt, call for help.","description":"Helping someone who is drowning — without becoming a second casualty. Get them out of the water as safely as you can, then check their breathing.","entry":"safety","nodes":{"safety":{"id":"safety","type":"action","title":"Rescue them safely","severity":"severe","body":["Try to rescue them WITHOUT entering the water — reach out a lifebuoy, rope or pole, ideally on a rope so you can pull them in","See if others nearby can help, for example with a boat","Only enter the water if you are properly trained — it is the last resort, as a panicking person may grab you and pull you under","If you cannot reach them safely, call emergency services and say someone is in the water","Once you have them, move them as flat (horizontal) as possible — a plank or board can help"],"media":{"type":"image","src":"media/dr_rescue.png","alt":"Reaching out a rope from the bank to a person in the water without entering it","caption":"Rescue from the bank — reach or throw a rope or pole; don't enter the water unless trained."},"donts":["Do not enter the water unless you are trained to rescue","Do not let yourself be pulled in by the person or the rope"],"links":[{"label":"Call an ambulance","action":"call"}],"next":"assess"},"assess":{"id":"assess","type":"decision","title":"Check them once they're out","prompt":"Are they breathing normally?","body":["Their airway may be blocked by water, mud or weed; they may vomit","They may have a head or spine injury after a dive or fall in shallow water","They may be very cold (hypothermic)"],"branches":[{"label":"Not breathing normally","goto":"out_cpr","severity":"critical"},{"label":"Unconscious but breathing","goto":"out_recovery","severity":"severe"},{"label":"Awake and breathing","goto":"out_warm","severity":"caution"}]},"out_cpr":{"id":"out_cpr","type":"outcome","title":"Start CPR now","severity":"critical","body":["Begin CPR straight away — getting air and blood moving comes first","They may have a spinal injury, but do not let that delay CPR if they are not breathing"],"links":[{"label":"Open CPR guide","algorithm":"cpr"},{"label":"Call an ambulance","action":"call"}]},"out_recovery":{"id":"out_recovery","type":"outcome","title":"Recovery position (mind the spine)","severity":"severe","body":["If you do NOT suspect a spinal injury, put them in the recovery position","If you DO suspect a spinal injury (a dive or fall), leave them on their back if they are breathing normally and support the head","Get them out of wet clothes, dry them and cover them warmly — do not rub them to warm them"],"links":[{"label":"Open Recovery Position guide","algorithm":"recovery_position"},{"label":"Call an ambulance","action":"call"}]},"out_warm":{"id":"out_warm","type":"outcome","title":"Warm them and get them checked","severity":"caution","body":["Take off wet clothing, dry them and cover them warmly — do not rub them to warm them","Keep them moving as little as possible","Anyone who has nearly drowned needs medical attention even if they seem fine — water can affect the lungs hours later","Keep checking their breathing"],"links":[{"label":"Call an ambulance","action":"call"}]}}}
</script>
<script type="application/json" id="algo-electric_shock">
{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"electric_shock","title":"Electric Shock","audience":"public","category":"Environmental","version":"0.1","sourcePdf":"First Aid Algorithms/Electric Shock.pdf","lastReviewed":"2023","disclaimer":"First-aid guidance for the public. It does not replace professional medical care. If in doubt, call for help.","description":"When the body touches electricity it acts as a conductor. The danger to YOU comes first — you must never become a second casualty. Low-voltage accidents (home sockets, appliances) are handled differently from high-voltage ones (power lines, pylons, train cables).","entry":"voltage","nodes":{"voltage":{"id":"voltage","type":"decision","title":"What kind of electrical accident is it?","prompt":"You can usually tell from the scene.","body":["Low voltage (under 1000 V): home sockets, plugs and appliances","High voltage (over 1000 V): power lines, pylons, overhead train cables — always serious; the person may have been thrown"],"branches":[{"label":"Low voltage — a home socket or appliance","goto":"low_safety","severity":"severe"},{"label":"High voltage, or I'm not sure","goto":"out_high","severity":"critical"}]},"low_safety":{"id":"low_safety","type":"action","title":"Make it safe — cut the power first","severity":"severe","body":["Turn off the power at the switch or fuse box and make sure it can't be turned back on","Then remove the person from the electrical source","If you cannot turn the power off: stand on dry, non-conducting material (wood, boxes, books) and wear rubber-soled shoes","Then push them away from the source using something that does not conduct electricity, such as a dry wooden stick"],"media":{"type":"image","src":"media/es_separate.png","alt":"Standing on dry boxes and using a dry wooden stick to push a person away from the electrical source","caption":"If you can't cut the power, stand on dry insulation and push them off the source with a dry wooden stick."},"donts":["Do not touch the person while they are still connected to the power","Do not approach if there is water around the electricity"],"next":"assess"},"assess":{"id":"assess","type":"observe","title":"Check the person","severity":"caution","body":["Only once the power is off: make first contact by touching them with the BACK of your hand","Check whether they are conscious and breathing normally","Look for burns where the electricity entered (often the hands) and where it left (often the feet)","They may have trouble breathing, chest discomfort, muscle cramps, or be unconscious"],"next":"seek"},"seek":{"id":"seek","type":"decision","title":"How are they?","prompt":"Any serious signs?","branches":[{"label":"Unconscious, struggling to breathe, chest pain, or getting worse","goto":"out_emergency","severity":"critical"},{"label":"Awake and seems okay","goto":"out_aftercare","severity":"safe"}]},"out_emergency":{"id":"out_emergency","type":"outcome","title":"Call an ambulance now","severity":"critical","body":["Call for urgent medical help","If they are unconscious but breathing, put them in the recovery position","If they are not breathing normally, start CPR"],"links":[{"label":"Call an ambulance","action":"call"},{"label":"Open CPR guide","algorithm":"cpr"},{"label":"Open Recovery Position guide","algorithm":"recovery_position"}]},"out_aftercare":{"id":"out_aftercare","type":"outcome","title":"Still get them checked","severity":"caution","body":["Anyone who has had an electric shock should get medical attention, even if they seem to recover quickly — electricity can affect the heart","Cool and cover any burns with a clean, non-fluffy cloth","Stay with them and keep checking their breathing"],"links":[{"label":"Call an ambulance","action":"call"}]},"out_high":{"id":"out_high","type":"outcome","title":"Stay back and call emergency services","severity":"critical","body":["Keep yourself and everyone else at least 10 metres from any high-voltage installation","A cable on the ground may still be live, and so may the soil for several metres around it","Call emergency services and tell them it is a high-voltage accident","Leave the rescue to the professionals — do not approach until they say it is safe"],"donts":["Do not go near the person or the cable","Do not try to remove the power source yourself","Do not let bystanders approach"],"links":[{"label":"Call an ambulance","action":"call"}]}}}
</script>
<script type="application/json" id="algo-eye_injuries">
