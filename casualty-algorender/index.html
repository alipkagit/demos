{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"eye_injuries","title":"Eye Injuries","audience":"public","category":"Injuries","version":"0.1","sourcePdf":"First Aid Algorithms/Eye Injuries.pdf","lastReviewed":"2023","disclaimer":"First-aid guidance for the public. It does not replace professional medical care. If in doubt, call for help.","description":"The eye is delicate — handle every eye injury with care. What to do depends on what happened: a chemical splash, an object stuck in the eye, a speck of grit, or a blow.","entry":"type","nodes":{"type":{"id":"type","type":"decision","title":"What happened to the eye?","prompt":"Choose what fits best.","branches":[{"label":"A chemical or harmful liquid in the eye","goto":"chemical","severity":"critical"},{"label":"An object stuck in the eye","goto":"embedded","severity":"severe"},{"label":"A speck or piece of grit in the eye","goto":"speck","severity":"caution"},{"label":"A blow to the eye (black eye)","goto":"blow","severity":"caution"}]},"chemical":{"id":"chemical","type":"action","title":"Chemical in the eye — rinse at once","severity":"critical","body":["Rinse the eye straight away with clean water","Keep rinsing for 10–15 minutes","Pour from the nose side outwards, so the liquid doesn't run into the other eye","Get help / arrange urgent transport to medical care"],"media":{"type":"image","src":"media/ey_irrigate.png","alt":"Pouring clean water across an open eye from the nose side outwards","caption":"Rinse with clean water for 10–15 minutes, pouring from the nose side outwards."},"links":[{"label":"Call an ambulance","action":"call"}],"next":"out_seek"},"embedded":{"id":"embedded","type":"action","title":"Object stuck in the eye","severity":"severe","body":["Get help","Loosely cover the injured eye","Cover the GOOD eye too and ask them to keep it still — both eyes move together","Keep the head as still as possible","If you are alone, arrange urgent transport to medical care"],"donts":["Do not try to remove the object","Do not press on the eye"],"links":[{"label":"Call an ambulance","action":"call"}],"next":"out_seek"},"speck":{"id":"speck","type":"action","title":"Speck or grit in the eye","severity":"caution","body":["Sit them down","Rinse the speck out from the nose side outwards, using clean water (boiled and cooled)","Use water at room temperature — it is more comfortable and safer for the eye"],"warning":"Do not use cold or warm water — it can hurt the eye. Use clean, room-temperature water.","next":"speck_check"},"speck_check":{"id":"speck_check","type":"decision","title":"Did it come out?","prompt":"Is the eye comfortable now?","branches":[{"label":"Yes — the speck rinsed out","goto":"out_followup","severity":"safe"},{"label":"No — it won't come out","goto":"out_seek","severity":"caution"}]},"blow":{"id":"blow","type":"action","title":"A blow to the eye","severity":"caution","body":["Make a cold compress: ice in a plastic bag wrapped in a cloth, or a clean cloth soaked in cold water and wrung out","Make sure the eye is fully closed, then rest the cold compress on it loosely","Keep it on as long as they can tolerate — it eases pain and swelling"],"donts":["Do not press hard against the eye"],"next":"out_followup"},"out_seek":{"id":"out_seek","type":"outcome","title":"Get medical help urgently","severity":"severe","body":["Eye injuries need careful, expert care","Get immediate help if a harmful liquid got in, an object or speck is stuck, or the vision is affected","If you covered the eye, leave it covered and keep the head still on the way"],"links":[{"label":"Call an ambulance","action":"call"}]},"out_followup":{"id":"out_followup","type":"outcome","title":"Watch the eye over the next days","severity":"safe","body":["Seek immediate help if pain gets worse, vision gets worse, or the eye is no better after 3 days"]}}}
</script>
<script type="application/json" id="algo-fainting">
{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"fainting","title":"Fainting","audience":"public","category":"Collapse & consciousness","version":"0.1","sourcePdf":"First Aid Algorithms/Fainitng.pdf","lastReviewed":"2023","disclaimer":"First-aid guidance for the public. It does not replace professional medical care. If in doubt, call for help.","description":"Fainting is a brief, sudden loss of consciousness caused by a short drop in blood supply to the brain — from emotion, tiredness, hunger, heat, standing too long or standing up quickly. Most people recover quickly.","entry":"recognise","nodes":{"recognise":{"id":"recognise","type":"observe","title":"Signs someone is about to faint","severity":"info","body":["Pale skin","Feeling dizzy; seeing black spots or stars","A murmur or ringing in the ears","Feeling weak and sometimes sick","Sweating, with cold, clammy skin","Yawning","Tingling in the fingers","They may then lose consciousness and fall"],"refs":["feel_faint"],"next":"care"},"care":{"id":"care","type":"action","title":"Help them","severity":"caution","body":["Help them lie down on the ground","Make sure they get plenty of fresh air and ask bystanders to stand back","Loosen any tight clothing that makes breathing hard","Put a cold, wet cloth on their forehead"],"media":{"type":"image","src":"media/fa_liedown.png","alt":"A person lying flat on the ground after fainting","caption":"Help them lie down flat and make sure they get plenty of fresh air."},"next":"recover"},"recover":{"id":"recover","type":"decision","title":"Did they come round?","prompt":"Have they regained consciousness within about 2 minutes?","branches":[{"label":"Yes — they came round","goto":"out_aftercare","severity":"safe"},{"label":"No — still unconscious after 2 minutes","goto":"out_unconscious","severity":"critical"}]},"out_aftercare":{"id":"out_aftercare","type":"outcome","title":"After they come round","severity":"safe","body":["Let them lie still for a few minutes","Then help them sit up slowly, and stand up only gradually","If they feel weak again, lay them back down until they fully recover","Check whether they hurt themselves in the fall and treat any injury","Get medical advice if they faint again, do not fully recover, or you are worried"],"links":[{"label":"Call an ambulance","action":"call"}]},"out_unconscious":{"id":"out_unconscious","type":"outcome","title":"Treat as unconscious","severity":"critical","body":["If they do not come round within 2 minutes, treat them as an unconscious casualty","Put them in the recovery position and keep checking response and breathing every minute","Be ready to start CPR if normal breathing stops"],"links":[{"label":"Open Recovery Position guide","algorithm":"recovery_position"},{"label":"Open CPR guide","algorithm":"cpr"},{"label":"Call an ambulance","action":"call"}]}},"references":{"feel_faint":{"id":"feel_faint","kind":"procedure","title":"If YOU feel about to faint","steps":["Lie down if you can","Or sit on the edge of a chair or bed and bend your head forward between your knees","Or squat down","Or stand with your legs crossed and tense your leg muscles — go up on tiptoe or stretch your legs"]}}}
</script>
<script type="application/json" id="algo-fever">
{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"fever","title":"Fever","audience":"public","category":"Sudden illness","version":"0.1","sourcePdf":"First Aid Algorithms/Fever.pdf","lastReviewed":"2023","disclaimer":"First-aid guidance for the public. It does not replace professional medical care. If in doubt, call for help.","description":"A fever can be a sign of serious illness, and anyone with a fever needs a doctor to find the cause. Fevers from malaria or pneumonia can be deadly if left untreated. This is especially important for babies, children and pregnant women.","entry":"recognise","nodes":{"recognise":{"id":"recognise","type":"observe","title":"Signs of fever","severity":"info","body":["Feels warm or hot to the touch","Sweating but with goose bumps; may shiver and chatter their teeth","Feels unwell, with a headache","Muscle aches","May show signs of dehydration","A high fever in a young child can trigger a fit"],"refs":["malaria"],"next":"care"},"care":{"id":"care","type":"action","title":"Cool and comfort them","severity":"caution","body":["Wash your hands first","Check their temperature: in the armpit if you have a thermometer — a fever is above 37.5 °C; or if they feel hot to the touch, treat it as a fever","Rest, with plenty of fluids to prevent dehydration","Dress them so they are neither too warm (raises the fever) nor too cold (causes shivering)","Sponge with LUKEWARM water unless it upsets them or causes shivering","Where allowed, an anti-fever medicine can help if they are suffering","Keep checking on them day and night","Seek medical help to find the cause of the fever"],"donts":["Do not sponge with cold water — it causes shivering, which tires the body"],"links":[{"label":"Open Dehydration guide","algorithm":"dehydration"},{"label":"Open Seizures guide","algorithm":"seizures"}],"next":"seek"},"seek":{"id":"seek","type":"decision","title":"Does this need urgent help?","prompt":"Is any of these true?","branches":[{"label":"Can't take medicine · a fit · very sleepy/hard to wake/confused · keeps vomiting · can't drink or signs of dehydration · can't stand or sit · a baby too weak to be carried · fast or difficult breathing or wheezing · bleeding for no reason","goto":"out_emergency","severity":"critical"},{"label":"None of these — but still get the cause checked","goto":"out_seek","severity":"caution"}]},"out_emergency":{"id":"out_emergency","type":"outcome","title":"Get emergency help now","severity":"critical","body":["These are danger signs — get emergency medical help straight away","Especially urgent for babies, children and pregnant women","Keep giving small sips of fluid on the way"],"links":[{"label":"Call an ambulance","action":"call"}]},"out_seek":{"id":"out_seek","type":"outcome","title":"Still see a doctor","severity":"caution","body":["Any fever needs a doctor to find the cause — malaria and pneumonia can be deadly if missed","Keep them hydrated, comfortable and not too warmly dressed","Keep rechecking them; come back for help if they get worse"],"refs":["malaria"],"links":[{"label":"Call an ambulance","action":"call"}]}},"references":{"malaria":{"id":"malaria","kind":"procedure","title":"Note: Malaria","warning":"Anyone with malaria needs medical attention. In a malaria area, severe headache can mean dangerous cerebral malaria — get to a medical facility immediately.","steps":["Malaria is spread by infected mosquitoes","It may cause fever, cough, headache, tiredness, aching muscles, abdominal pain, loss of appetite, dizziness and nausea","Give first aid for fever","Make sure the person is seen by a health worker — every case of malaria needs medical attention"]}}}
</script>
<script type="application/json" id="algo-head_injury">
{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"head_injury","title":"Head Injury","audience":"public","category":"Injuries","version":"0.1","sourcePdf":"First Aid Algorithms/Head Injury.pdf","lastReviewed":"2023","disclaimer":"First-aid guidance for the public. It does not replace professional medical care. If in doubt, call for help.","description":"Head injuries range from a minor bump or scalp cut to a serious brain or skull injury. They may follow a blow to the head or a sudden jolt (a fall or road crash). Always consider a neck/spine injury too.","entry":"recognise","nodes":{"recognise":{"id":"recognise","type":"observe","title":"Check the head injury","severity":"info","body":["First check they are conscious and breathing normally","There may be a bump, a bleeding scalp wound, or a deep cut","They may have a headache, feel drowsy or be confused"],"next":"severity"},"severity":{"id":"severity","type":"decision","title":"How serious is it?","prompt":"Look for the warning signs of a serious head injury.","branches":[{"label":"Serious — hard blow (road crash, fall from height), vomiting, a terrible or lasting headache, drowsy/confused, fluid or blood from nose/ear, a fit, or any loss of consciousness","goto":"severe_care","severity":"critical"},{"label":"Minor — a small bump or cut, fully awake and alert","goto":"minor_care","severity":"caution"}]},"minor_care":{"id":"minor_care","type":"action","title":"Care for a minor head injury","severity":"caution","body":["For a minor cut or graze on the head, treat it as a skin wound — clean and cover it","For a bump, hold a cold compress (ice wrapped in a cloth, or cold water) loosely on it to ease swelling and pain","Cool for as long as they can tolerate, but no longer than 20 minutes"],"timer":{"label":"Cool the bump — no longer than 20 minutes","durationSec":1200,"kind":"countdown"},"warning":"Do not cool a bleeding wound. Stop the bleeding and dress it first; then you can cool the area.","refs":["bandage_head"],"links":[{"label":"Open Bleeding & Wounds guide","algorithm":"bleeding_wounds"}],"next":"minor_seek"},"minor_seek":{"id":"minor_seek","type":"decision","title":"Does it need a doctor?","prompt":"Is any of these true?","branches":[{"label":"Bite / dirty or rusty object · wound on the face · large or jagged wound · can't be cleaned · diabetes/immune problem or 60+ · tetanus jab over 10 years ago (or unsure) · feels unwell · any doubt about how bad it is","goto":"out_seek","severity":"caution"},{"label":"None of these — minor and they feel fine","goto":"out_watch","severity":"safe"}]},"out_watch":{"id":"out_watch","type":"outcome","title":"Rest and watch them","severity":"safe","body":["Let them rest and keep an eye on them for the next day or so","Get medical help quickly if they become drowsy or hard to wake, confused, vomit repeatedly, have a worsening headache, or have a fit","When in doubt, get them checked"]},"out_seek":{"id":"out_seek","type":"outcome","title":"Get medical attention","severity":"caution","body":["Have the injury seen by a health worker","A tetanus injection may be needed for a dirty wound","Keep watching for any signs of a more serious head injury"],"links":[{"label":"Call an ambulance","action":"call"}]},"severe_care":{"id":"severe_care","type":"action","title":"Serious head injury","severity":"critical","body":["Call an ambulance now","If they are conscious and breathing: keep them calm and still, and stop them moving","Suspect a neck/spine injury — only support the head and neck still if they will cooperate; do not force it if they are agitated","If they are unconscious and breathing: leave them as you found them and lift the chin to open the airway WITHOUT tilting the head; only use the recovery position if you must leave them alone or they vomit, supporting the neck as you turn them","For a serious head wound: leave any flap of skin, and if it bleeds heavily press to control it"],"media":{"type":"image","src":"media/hi_lie.png","alt":"An unconscious person lying still after a serious head injury, head supported and airway open","caption":"Keep them still and support the head and neck; lift the chin without tilting the head."},"timer":{"label":"Press to control heavy bleeding for 10 minutes, then apply a pressure bandage","durationSec":600,"kind":"countdown"},"donts":["Do not tilt the head of an unconscious head-injury casualty — lift the chin only","Do not clean or rinse a serious head wound","Do not try to straighten a crooked nose or push back a dislocated jaw yourself"],"links":[{"label":"Call an ambulance","action":"call"},{"label":"Open Recovery Position guide","algorithm":"recovery_position"},{"label":"Open CPR guide","algorithm":"cpr"}],"next":"out_monitor"},"out_monitor":{"id":"out_monitor","type":"outcome","title":"Stay with them until help arrives","severity":"critical","body":["Check their consciousness and breathing every minute","If their normal breathing stops, start CPR"],"links":[{"label":"Open CPR guide","algorithm":"cpr"},{"label":"Call an ambulance","action":"call"}]}},"references":{"bandage_head":{"id":"bandage_head","kind":"procedure","title":"Technique: Bandaging a head wound","steps":["Once the wound is cleaned, place a clean gauze pad over the whole wound","Ask them to keep the head still; bring the first turn around the head at a slight angle","Keep the ears and eyes uncovered","Fold back the starting tip and cover it with the next turn so the bandage won't slip","Wrap around the head a few times; take a turn a little lower at the back of the head for grip","Fasten with tape or a clip"]}}}
</script>
<script type="application/json" id="algo-heart_attack">
{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"heart_attack","title":"Chest Pain / Heart Attack","audience":"public","category":"Sudden illness","version":"0.1","sourcePdf":"First Aid Algorithms/Chest Pain - Heart Attack.pdf","lastReviewed":"2023","disclaimer":"First-aid guidance for the public. It does not replace professional medical care. If in doubt, call for help.","description":"Chest discomfort can mean the heart is not getting enough blood, which can lead to a heart attack. Heart muscle starts to die once it loses its oxygen supply, so this is an emergency.","entry":"recognise","nodes":{"recognise":{"id":"recognise","type":"observe","title":"Signs of a heart attack","severity":"info","body":["Discomfort, pain or tightness in the chest","Pain spreading to the shoulder, neck, jaw, arm or stomach","Difficulty breathing","Sweating","Feeling sick or vomiting","Dizziness or fainting"],"next":"care"},"care":{"id":"care","type":"action","title":"Help them and call for help","severity":"severe","body":["Call an ambulance now — do not delay","Help them into a comfortable position — sitting or half-sitting is usually easiest for breathing","Make them rest and ask them not to move; reassure them and explain what is happening","Ask whether they take heart medication and have taken it as prescribed"],"media":{"type":"image","src":"media/ha_position.png","alt":"Helping a person with chest pain into a sitting, half-reclined position of comfort","caption":"Sit them half-upright in a position of comfort; where allowed, a 300 mg aspirin can be chewed."},"dosing":[{"drug":"Aspirin (chewed)","fixed":"one 300 mg tablet — chew, then swallow with water","note":"Only where local rules allow a first-aider to give it, and the person is not allergic to aspirin. It helps blood reach the heart."}],"links":[{"label":"Call an ambulance","action":"call"}],"next":"out_monitor"},"out_monitor":{"id":"out_monitor","type":"outcome","title":"Stay with them until help arrives","severity":"severe","body":["If you are alone, arrange urgent transport to medical care yourself","Keep checking their consciousness and breathing","If they collapse and stop breathing normally, start CPR straight away"],"links":[{"label":"Open CPR guide","algorithm":"cpr"},{"label":"Call an ambulance","action":"call"}]}}}
</script>
<script type="application/json" id="algo-nosebleed">
{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"nosebleed","title":"Nose Bleed","audience":"public","category":"Bleeding & wounds","version":"0.1","sourcePdf":"First Aid Algorithms/Nose Bleeding.pdf","lastReviewed":"2023","disclaimer":"First-aid guidance for the public. It does not replace professional medical care. If in doubt, call for help.","description":"The nose has small blood vessels that break easily — from a knock, sneezing, blowing or picking the nose, or for no clear reason. Most nosebleeds are easily stopped, but some need medical help.","entry":"recognise","nodes":{"recognise":{"id":"recognise","type":"observe","title":"What you see","severity":"info","body":["Blood is dripping or running from the nose","Blood may also run down the back of the throat","If they have swallowed blood, they may feel sick"],"next":"danger_check"},"danger_check":{"id":"danger_check","type":"decision","title":"Is this a serious nosebleed?","prompt":"Is any of these true?","branches":[{"label":"Caused by a blow to the nose/head, a fall or road crash; blood is spurting; or they become sleepy or pass out","goto":"out_seek","severity":"severe"},{"label":"None of these — an ordinary nosebleed","goto":"pinch","severity":"safe"}]},"pinch":{"id":"pinch","type":"action","title":"Pinch the soft part of the nose","severity":"caution","body":["Ask them to sit and lean FORWARDS, breathing through the mouth","Pinch the soft part of the nose (just below the bony bridge) with thumb and index finger; do it for them if needed","Hold without letting go for at least 5 minutes","Protect yourself from their blood — use gloves or a clean plastic bag if you can"],"media":{"type":"image","src":"media/nb_pinch.png","alt":"Sitting and leaning forward while pinching the soft part of the nose","caption":"Lean forward and pinch the soft part of the nose just below the bony bridge."},"timer":{"label":"Pinch without letting go for 5 minutes","durationSec":300,"kind":"countdown"},"next":"check"},"check":{"id":"check","type":"decision","title":"Has it stopped?","prompt":"After 5 minutes of pinching, has the bleeding stopped?","branches":[{"label":"Yes — it has stopped","goto":"out_aftercare","severity":"safe"},{"label":"No — still bleeding","goto":"pinch_again","severity":"caution"}]},"pinch_again":{"id":"pinch_again","type":"action","title":"Pinch for another 5 minutes","severity":"caution","body":["Keep leaning forward and breathing through the mouth","Pinch the soft part of the nose again, without letting go, for a further 5 minutes","You can repeat this a few times"],"timer":{"label":"Pinch again for another 5 minutes","durationSec":300,"kind":"countdown"},"next":"check2"},"check2":{"id":"check2","type":"decision","title":"Has it stopped now?","prompt":"Is the bleeding under control?","branches":[{"label":"Yes — it has stopped","goto":"out_aftercare","severity":"safe"},{"label":"No — it will not stop","goto":"out_seek","severity":"severe"}]},"out_aftercare":{"id":"out_aftercare","type":"outcome","title":"After the bleeding stops","severity":"safe","body":["Do not blow or pick the nose for the next few hours","Wash your hands with soap (or ash if there is no soap)"]},"out_seek":{"id":"out_seek","type":"outcome","title":"Get medical help","severity":"severe","body":["A nosebleed that will not stop, or one after a blow or fall, can be serious","Keep pinching the nose and leaning forward while you arrange help","Get medical help; call an ambulance if they are drowsy, passing out, or losing a lot of blood"],"links":[{"label":"Call an ambulance","action":"call"}]}}}
</script>
<script type="application/json" id="algo-poisoning">
{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"poisoning","title":"Poisoning","audience":"public","category":"Environmental","version":"0.1","sourcePdf":"First Aid Algorithms/Poisoning.pdf","lastReviewed":"2023","disclaimer":"First-aid guidance for the public. It does not replace professional medical care. If in doubt, call for help.","description":"A poison is any substance that harms the body. It can be swallowed, breathed in, injected, or absorbed through the skin. Protect yourself first, then get expert help fast.","entry":"recognise","nodes":{"recognise":{"id":"recognise","type":"observe","title":"Signs of poisoning","severity":"info","body":["Poison can enter by being swallowed, breathed in, injected, or absorbed through the skin","Vomiting, cramps, sweating, skin changing colour","Very large or very small pupils; burns in the mouth or throat","Headache, dizziness, fainting or loss of consciousness","Breathing too fast, too slow, shallow — or stopping","Heart palpitations, signs of shock, muscle twitching or seizures"],"next":"care"},"care":{"id":"care","type":"action","title":"Protect yourself, then help","severity":"severe","body":["Protect yourself — do not touch the poison or let it touch you","Get help / call a poison centre or ambulance","Place them on their LEFT side — this slows how fast the poison is absorbed","Find out what the poison was, how much, and when, if you can","If it is safe, keep the container or label to show the doctor","If you are alone, arrange urgent transport to medical care"],"media":{"type":"image","src":"media/po_leftside.png","alt":"Placing a poisoned person on their left side","caption":"Place them on their LEFT side — this slows how fast the poison is absorbed."},"donts":["Do not touch or breathe in the poison yourself","Do not give them anything to eat or drink","Do not make them vomit — unless a doctor or nurse tells you to"],"links":[{"label":"Call an ambulance","action":"call"},{"label":"Open Shock guide","algorithm":"shock"}],"next":"out_monitor"},"out_monitor":{"id":"out_monitor","type":"outcome","title":"Stay with them until help arrives","severity":"severe","body":["Keep checking their consciousness and breathing","If they are unconscious but breathing, keep them on their side in the recovery position","If their normal breathing stops, start CPR"],"links":[{"label":"Open Recovery Position guide","algorithm":"recovery_position"},{"label":"Open CPR guide","algorithm":"cpr"},{"label":"Call an ambulance","action":"call"}]}}}
</script>
<script type="application/json" id="algo-recovery_position">
{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"recovery_position","title":"Recovery Position","audience":"public","category":"Core skills","version":"0.1","sourcePdf":"First Aid Algorithms/Recovery Position.pdf","lastReviewed":"2023","disclaimer":"First-aid guidance for the public. It does not replace professional medical care or a hands-on first-aid course. If in doubt, call for help.","description":"The recovery position keeps an unconscious person's airway open and stops vomit or blood from entering the lungs. Use it for someone who is unconscious but breathing normally.","entry":"check","nodes":{"check":{"id":"check","type":"decision","title":"Is the recovery position the right thing to do?","prompt":"Is the person unconscious but breathing normally?","severity":"caution","body":["The recovery position is for someone who is unconscious but still breathing normally on their own","It keeps their airway open and stops vomit or blood from blocking it"],"branches":[{"label":"Yes — unconscious but breathing","goto":"prepare","severity":"caution"},{"label":"No — not breathing / only gasping","goto":"out_cpr","severity":"critical"}]},"prepare":{"id":"prepare","type":"action","title":"Get them ready","severity":"caution","body":["Kneel beside their chest","If they wear glasses, take them off","Make sure both their legs are straight","Take the arm nearest you and place it out at a right angle to the body, elbow bent, palm facing up — do not force it"],"next":"roll"},"roll":{"id":"roll","type":"action","title":"Roll them onto their side","severity":"caution","body":["Take their far arm and bring the hand across to the cheek nearest you; hold the back of the hand against the cheek","With your other hand, lift the far knee so the foot stays flat on the ground","Pull on the raised knee to roll them towards you, keeping their hand pressed to the cheek — they roll onto their side"],"media":{"type":"image","src":"media/recovery_roll.png","alt":"Rolling an unconscious person onto their side by pulling on the bent far knee","caption":"Pull on the raised knee to roll them towards you onto their side."},"next":"position"},"position":{"id":"position","type":"action","title":"Settle the position and open the airway","severity":"caution","body":["Adjust the upper leg so the hip and knee are both bent at right angles — this stops them rolling onto their face","Gently tilt the head back so the airway stays open","Make sure the mouth points slightly down to the ground so fluid can drain; adjust the hand under the cheek to hold the head tilted","A poisoned person or a pregnant woman is best placed on their LEFT side; either side is fine if injuries or space make the left side impossible","For a child or baby, a small pillow or rolled blanket behind the back helps keep them steady"],"media":{"type":"image","src":"media/recovery_position.png","alt":"Final recovery position with head tilted back, mouth pointing down and hand supporting the cheek","caption":"Tilt the head back, mouth pointing down to the ground, hand under the cheek."},"next":"monitor"},"monitor":{"id":"monitor","type":"decision","title":"Keep watching them","prompt":"Check their response and breathing every minute. Are they still breathing normally?","severity":"caution","body":["Stay with them and check every minute that they are still breathing normally","Be ready to start CPR the moment normal breathing stops"],"branches":[{"label":"Yes — still breathing","goto":"out_stay","severity":"safe"},{"label":"No — breathing has stopped","goto":"out_cpr","severity":"critical"}]},"out_stay":{"id":"out_stay","type":"outcome","title":"Stay with them until help arrives","severity":"safe","body":["Keep them in the recovery position and keep checking their breathing every minute","Call for medical help if you have not already","If they have to stay like this a long time, turn them onto the other side after about 30 minutes"],"links":[{"label":"Call an ambulance","action":"call"}]},"out_cpr":{"id":"out_cpr","type":"outcome","title":"Start CPR now","severity":"critical","body":["If they are not breathing normally, begin chest compressions straight away and call for an ambulance"],"links":[{"label":"Open CPR guide","algorithm":"cpr"},{"label":"Call an ambulance","action":"call"}]}}}
</script>
<script type="application/json" id="algo-road_traffic_crash">
{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"road_traffic_crash","title":"Road Traffic Crash","audience":"public","category":"Core skills","version":"0.1","sourcePdf":"First Aid Algorithms/Road traffic Crash.pdf","lastReviewed":"2023","disclaimer":"First-aid guidance for the public. It does not replace professional medical care or a hands-on first-aid course. If in doubt, call for help.","description":"At any accident, follow four steps in order: make the area safe, assess the casualty, seek help, and give first aid. Your own safety comes first — never become a second casualty.","entry":"safety","nodes":{"safety":{"id":"safety","type":"action","title":"Step 1 — Make the area safe","severity":"severe","body":["Never approach if there is danger to you, bystanders or the casualty","Remove the danger if you can — for example, switch off the car's ignition to reduce the risk of fire","Put up a sign or warning to alert approaching traffic","As a rule, do NOT move the injured person — movement can make injuries worse"],"donts":["Do not approach while the scene is unsafe","Do not move the injured person unless you really have to"],"next":"move"},"move":{"id":"move","type":"decision","title":"Do you need to move them?","prompt":"Only move them if ALL of these are true.","body":["They are in more danger if left where they are","The scene cannot be made safe","Medical help will not arrive soon","And you can move them without putting yourself in danger"],"branches":[{"label":"Yes — they must be moved","goto":"move_how","severity":"severe"},{"label":"No — leave them where they are","goto":"assess","severity":"caution"}]},"move_how":{"id":"move_how","type":"action","title":"Move them carefully","severity":"severe","body":["If they are conscious, explain what you will do and ask them to follow your instructions","Do not twist the head, neck or body; support the neck if you can","Move quickly but keep the body as still as possible","Move them only to the nearest safe place"],"refs":["moving_technique"],"next":"assess"},"assess":{"id":"assess","type":"action","title":"Step 2 — Assess the casualty","severity":"severe","body":["Once it is safe, check the casualty: danger, response, airway, breathing","Act on what you find — open the full assessment guide to be walked through it"],"links":[{"label":"Open Assess a Casualty guide","algorithm":"assess_casualty"}],"next":"seek"},"seek":{"id":"seek","type":"action","title":"Step 3 — Seek help","severity":"severe","body":["An ambulance is the best transport — call one if it can come quickly","Other transport (a car, motorbike or bicycle) can be used if there is no ambulance","Call the police as well for a road accident","If you are alone, shout or call for help but do not leave the casualty"],"media":{"type":"image","src":"media/rtc_car.png","alt":"Sliding an injured person carefully onto a reclined car seat for transport","caption":"No ambulance? An injured person can be moved into a car — recline the seat and keep them as flat and still as possible."},"links":[{"label":"Call an ambulance","action":"call"}],"next":"first_aid"},"first_aid":{"id":"first_aid","type":"outcome","title":"Step 4 — Give first aid","severity":"severe","body":["Treat the most life-threatening problem first","Common priorities: open the airway / start CPR if not breathing; control severe bleeding; treat for shock","Stay with the casualty until medical help takes over"],"links":[{"label":"Open Assess a Casualty guide","algorithm":"assess_casualty"},{"label":"Open CPR guide","algorithm":"cpr"},{"label":"Open Bleeding & Wounds guide","algorithm":"bleeding_wounds"},{"label":"Call an ambulance","action":"call"}]}},"references":{"moving_technique":{"id":"moving_technique","kind":"procedure","title":"Technique: Moving an injured person","warning":"Moving someone can worsen a spinal injury. Only move them if you must, and keep the body as still and straight as you can.","steps":["Alone: crouch behind them, hold their wrists and pull backwards — or grasp their clothing under the arms and pull; if they can hold on, consider carrying them on your back","With one helper (two-handed lift): each of you squats at one side facing the other; one arm around their back gripping clothing, the other under the thighs gripping the other helper's wrist; lift together","With one helper (four-handed seat): make a 'seat' by gripping your own and each other's wrists; have them sit on it with arms around your necks; lift together","With four helpers: kneel on each side, slide hands under to support the back, one person supports the head and neck, and lift evenly on a command","No stretcher? Improvise one with a blanket and two strong sticks"]}}}

{"schemaVersion":"0.3","validationStatus":"unvalidated-draft","id":"seizures","title":"Seizures (Fits)","audience":"public","category":"Collapse & consciousness","version":"0.1","sourcePdf":"First Aid Algorithms/Seizures.pdf","lastReviewed":"2023","disclaimer":"First-aid guidance for the public. It does not replace professional medical care. If in doubt, call for help.","description":"In a seizure (fit) the person suddenly shakes uncontrollably — in all limbs or just one. It can be caused by epilepsy, a high fever, malaria, a head injury, alcohol or drugs. Your job is to protect them from harm and time how long it lasts.","entry":"recognise","nodes":{"recognise":{"id":"recognise","type":"observe","title":"Recognise a seizure","severity":"info","body":["Sudden, uncontrollable shaking — not like ordinary shivering","They may lose consciousness","They may wet or soil themselves","Lips and nails may turn a dusky colour","Eyes may roll or turn to one side","Some people get a warning beforehand — flashes of light, a ringing sound, or an odd taste"],"next":"during"},"during":{"id":"during","type":"action","title":"Protect them during the fit","severity":"severe","body":["Move away anything that could hurt them, or move them only if they are in danger","If they are on the ground, put something soft under the head","Loosen tight clothing around the neck so they can breathe freely","Stay calm — most fits stop on their own within a couple of minutes"],"timer":{"label":"Time the seizure — call an ambulance if it lasts over 5 minutes","durationSec":300,"kind":"elapsed"},"donts":["Do not try to hold them down or stop the shaking","Do not put anything — including your fingers — in their mouth (they cannot swallow their tongue; a hand or object is dangerous to you both)","Do not move them unless they are in real danger"],"media":{"type":"image","src":"media/sz_protect.png","alt":"Cushioning the head of a person having a seizure on the ground","caption":"Put something soft under the head and clear away anything that could hurt them."},"next":"check"},"check":{"id":"check","type":"decision","title":"How is the fit going?","prompt":"Has the shaking stopped within about 5 minutes?","branches":[{"label":"Yes — it has stopped","goto":"after_care","severity":"caution"},{"label":"No — over 5 minutes, or another fit starts","goto":"out_emergency","severity":"critical"}]},"after_care":{"id":"after_care","type":"action","title":"After the fit stops","severity":"caution","body":["Once the shaking stops, put them in the recovery position to keep the airway open","Stay with them and talk calmly until they feel better — they may be confused or sleepy","If the fit was caused by a high fever, also give first aid for fever"],"media":{"type":"image","src":"media/sz_recovery.png","alt":"A person placed in the recovery position after a seizure","caption":"Once the shaking stops, put them in the recovery position."},"links":[{"label":"Open Recovery Position guide","algorithm":"recovery_position"},{"label":"Open Fever guide","algorithm":"fever"}],"next":"out_seek"},"out_emergency":{"id":"out_emergency","type":"outcome","title":"Call an ambulance now","severity":"critical","body":["A fit lasting more than 5 minutes, or repeated fits without waking up in between, is an emergency","Keep protecting them; when the shaking stops, put them in the recovery position","Be ready to start CPR if their normal breathing stops"],"links":[{"label":"Call an ambulance","action":"call"},{"label":"Open Recovery Position guide","algorithm":"recovery_position"},{"label":"Open CPR guide","algorithm":"cpr"}]},"out_seek":{"id":"out_seek","type":"outcome","title":"Get them seen by a doctor","severity":"caution","body":["Anyone who has had a fit needs medical attention","It is especially important if: it was their first fit; the fit lasted over 5 minutes; there were repeated fits; there was a high fever; they hurt themselves; alcohol or drugs were involved; or the person is a child","A child who has a fit should always be examined by a doctor"],"links":[{"label":"Call an ambulance","action":"call"}]}}}

<script>
"use strict";
// Content loader: scan every embedded algorithm block (id="algo-*") rather than
// hardcoding the set. The blocks are injected from content/*.json by tools/build-mockup.mjs
// (run `npm run build`), so content/ is the single source of truth and there is no drift.
const ALGOS = {};
document.querySelectorAll('script[type="application/json"][id^="algo-"]').forEach(s=>{
  try{ const a=JSON.parse(s.textContent); if(a&&a.id) ALGOS[a.id]=a; }
  catch(e){ console.error('Bad algorithm block '+s.id, e); }
});
// Home order: by category (life-threatening first), then title.
const CAT_RANK = { 'Life-threatening':0, 'Airway & Breathing':1 };
const ORDER = Object.keys(ALGOS).sort((x,y)=>{
  const a=ALGOS[x], b=ALGOS[y];
  const ra=CAT_RANK[a.category]??50, rb=CAT_RANK[b.category]??50;
  if(ra!==rb) return ra-rb;
  if(a.category!==b.category) return a.category.localeCompare(b.category);
  return a.title.localeCompare(b.title);
});

const app = { audience:'public', algoId:null, mode:'guide', nodeId:null, history:[], ctx:{}, openSheet:null, coach:null };

const SEV = ['info','safe','caution','severe','critical'];
const TYPE_META = {
  observe:{label:'Assess'}, decision:{label:'Decide'}, action:{label:'Do'},
  reassess:{label:'Reassess'}, outcome:{label:'Outcome'}, cpr:{label:'CPR Coach'}
};
function icon(type){
  const s='stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  switch(type){
    case 'observe': return `<svg viewBox="0 0 24 24"><path ${s} d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="2.6" ${s}/></svg>`;
    case 'decision': return `<svg viewBox="0 0 24 24"><path ${s} d="M6 3v6a3 3 0 0 0 3 3h9M18 8l3 4-3 4"/><circle cx="6" cy="3" r="0" ${s}/></svg>`;
    case 'action': return `<svg viewBox="0 0 24 24"><path ${s} d="M5 12h13M13 6l6 6-6 6"/></svg>`;
    case 'reassess': return `<svg viewBox="0 0 24 24"><path ${s} d="M20 11a8 8 0 1 0-2 6m2 2v-5h-5"/></svg>`;
    case 'outcome': return `<svg viewBox="0 0 24 24"><path ${s} d="M5 21V4h13l-2 4 2 4H5"/></svg>`;
    case 'cpr': return `<svg viewBox="0 0 24 24"><path ${s} d="M2 12h4l2-6 4 12 2-6h8"/></svg>`;
    default: return '';
  }
}
const esc = t => String(t==null?'':t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const $ = id => document.getElementById(id);

function openAlgo(id){
  const al=ALGOS[id]; app.algoId=id; app.mode='guide';
  app.nodeId=al.entry; app.history=[]; app.ctx={};
  (al.contexts||[]).forEach(c=>{ app.ctx[c.id]= c.default!==undefined?c.default:(c.type==='number'?'':''); });
  render();
}
function home(){ app.algoId=null; closeSheet(true); render(); }

/* ---------- top-level render ---------- */
function render(){
  stopCoach(); stopTimer();
  const scr=$('screen');
  if(!app.algoId){ scr.innerHTML=renderHome(); bindHome(); return; }
  const al=ALGOS[app.algoId];
  let html = ctrlBar(al) + draftBanner(al) + contextBar(al);
  html += (app.mode==='map') ? renderMap(al) : renderGuide(al);
  scr.innerHTML = html;
  bindAlgo(al);
  const cur=al.nodes[app.nodeId];
  if(app.mode==='guide' && cur && cur.type==='cpr') initCoach(cur);
  scr.scrollTop=0;
}

function renderHome(){
  const list = ORDER.map(id=>ALGOS[id]).filter(a=>a.audience===app.audience);
  const intro = app.audience==='public'
    ? 'First-aid guides you can follow step by step — or see the whole flow at a glance.'
    : 'Clinical algorithms as an interactive map, with built-in dosing and reference tables.';
  let cards = list.map(a=>{
    const steps=Object.keys(a.nodes).length;
    return `<div class="home-card" data-open="${a.id}">
      <div class="rail"></div>
      <h3>${esc(a.title)}</h3>
      <div class="cat">${esc(a.category)}</div>
      <div class="meta">
        <span class="pill">${a.audience==='public'?'First aid':'Clinician'}</span>
        <span class="pill">${steps} steps</span>
        ${a.validationStatus && a.validationStatus!=='published' ? `<span class="pill draft"><i class="dot"></i>Draft</span>` : ''}
      </div>
    </div>`;
  }).join('');
  return `<div class="eyebrow">${app.audience==='public'?'Self-care & first aid':'Clinical protocols'}</div>
    <h1 class="title">What's happening?</h1>
    <p class="sub">${intro}</p>${cards}
    <p class="sub" style="margin-top:8px;opacity:.8">${list.length} ${app.audience==='public'?'public first-aid guide'+(list.length===1?'':'s'):'clinical algorithm'+(list.length===1?'':'s')} · unvalidated drafts for review.</p>`;
}
function bindHome(){ document.querySelectorAll('[data-open]').forEach(c=>c.onclick=()=>openAlgo(c.dataset.open)); }

/* ---------- control + context bars ---------- */
function ctrlBar(al){
  return `<div class="ctrlbar">
    <button class="back" id="backHome">‹ All</button>
    <div class="modetoggle" id="modeToggle">
      <button data-mode="map" class="${app.mode==='map'?'on':''}">${icon('decision')} Map</button>
      <button data-mode="guide" class="${app.mode==='guide'?'on':''}">${icon('action')} Guide</button>
    </div>
  </div>
  <div class="eyebrow">${esc(al.category)}</div>
  <h1 class="title">${esc(al.title)}</h1>`;
}
function draftBanner(al){
  if(!al.validationStatus || al.validationStatus==='published') return '';
  const label = al.validationStatus==='clinician-reviewed' ? 'Clinician-reviewed' : 'Unvalidated draft';
  const msg = al.validationStatus==='clinician-reviewed'
    ? 'Reviewed by a clinician. Still does not replace professional medical care.'
    : 'Drafted from a source document and <b>not yet checked by a clinician</b>. Do not rely on it for real first aid.';
  return `<div class="draftbar">${icon('outcome')}<span><b>${label}.</b> ${msg}</span></div>`;
}
function contextBar(al){
  const c=(al.contexts||[])[0]; if(!c) return '';
  if(c.type==='choice'){
    const opts=c.options.map(o=>`<button data-ctx="${c.id}" data-val="${o.id}" class="${app.ctx[c.id]===o.id?'on':''}">${esc(o.label)}</button>`).join('');
    return `<div class="ctx"><div class="lbl">${esc(c.label)}</div><div class="choice">${opts}</div></div>`;
  }
  if(c.type==='number'){
    return `<div class="ctx"><div class="lbl">${esc(c.label)} — powers live dosing</div>
      <div class="wt"><input id="ctxNum" type="number" inputmode="decimal" placeholder="${esc(c.placeholder||'')}" value="${esc(app.ctx[c.id]||'')}"><span class="u">${esc(c.unit||'')}</span></div></div>`;
  }
  return '';
}

/* ---------- dosing ---------- */
function round(n){ return Number(n.toFixed(1)).toString(); }
function renderDose(d){
  let inner=`<div class="drug">${esc(d.drug)}</div>`;
  if(d.fixed){
    inner+=`<div class="val">${esc(d.fixed)}</div>`;
  } else if(d.formula){
    const f=d.formula, w=parseFloat(app.ctx.weight);
    const base=`${f.perKg} ${f.unit}/kg${f.max?` · max ${f.max} ${f.unit}`:''}`;
    if(w>0){
      let v=f.perKg*w, capped=(f.max&&v>f.max);
      v=capped?f.max:v;
      inner+=`<div class="val"><span class="calc">${round(v)} ${esc(f.unit)}</span></div>
        <div class="formula">${base}${capped?' (capped)':` · ${f.perKg}×${w} kg`}</div>`;
    } else {
      inner+=`<div class="val">${esc(base)}</div><div class="hint">Enter weight above to calculate the dose</div>`;
    }
  } else if(d.bands){
    inner+=`<div class="bands">`+d.bands.map(b=>`<div class="band"><span>${esc(b.match)}</span><b>${esc(b.dose)}</b></div>`).join('')+`</div>`;
  }
  if(d.note) inner+=`<div class="note">${esc(d.note)}</div>`;
  return `<div class="dose">${inner}</div>`;
}
function renderDosing(node){ return (node.dosing||[]).map(renderDose).join(''); }

/* ---------- node content (shared by guide + sheet) ---------- */
function bodyFor(node){
  if(node.contextBody && node.contextBody[app.ctx.age]) return node.contextBody[app.ctx.age];
  return node.body||[];
}
function mediaFor(node){
  if(node.contextMedia && node.contextMedia[app.ctx.age]) return node.contextMedia[app.ctx.age];
  return node.media;
}
function nodeInner(al,node,opts){
  opts=opts||{};
  let h='';
  const body=bodyFor(node);
  if(body.length) h+=`<ul class="body">`+body.map(b=>`<li>${esc(b)}</li>`).join('')+`</ul>`;
  h+=renderDosing(node);
  if(node.timer) h+=timerBlock(node.timer);
  if(node.warning) h+=`<div class="warn">${icon('outcome')}<span>${esc(node.warning)}</span></div>`;
  if(node.donts && node.donts.length) h+=dontsBlock(node.donts);
  const _m=mediaFor(node);
  if(opts.media!==false && _m) h+=mediaBlock(_m);
  // chips: refs + links
  let chips=[];
  (node.refs||[]).forEach(r=>{ const ref=al.references[r]; if(ref) chips.push(`<button class="chip" data-ref="${r}">${icon('observe')} ${esc(ref.title)}</button>`); });
  (node.links||[]).forEach((l,i)=>{
    if(l.action==='call') chips.push(`<button class="chip call" data-call="1">${callIco()} ${esc(l.label)}</button>`);
    else chips.push(`<button class="chip" data-link="${esc(l.algorithm||'')}" data-llabel="${esc(l.label)}">${icon('action')} ${esc(l.label)}</button>`);
  });
  if(chips.length) h+=`<div class="chips">${chips.join('')}</div>`;
  return h;
}
function mediaBlock(m){ return `<div class="media"><img src="${esc(m.src)}" alt="${esc(m.alt||'')}">${m.caption?`<div class="cap">${esc(m.caption)}</div>`:''}</div>`; }
function dontsBlock(list){
  return `<div class="donts"><div class="dhead">${icon('outcome')} Do NOT</div><ul>`+list.map(d=>`<li>${esc(d)}</li>`).join('')+`</ul></div>`;
}
function timerBlock(t){
  // initial display: countdown shows the full duration, elapsed starts at 0:00
  const init = t.kind==='countdown' ? fmtT(t.durationSec) : '0:00';
  return `<div class="timerbox" data-dur="${t.durationSec}" data-kind="${esc(t.kind)}">
    <div class="tlbl">${esc(t.label)}</div>
    <div class="tdisp">${init}</div>
    <div class="tnote"></div>
    <div class="tctrls"><button class="t-start">Start</button><button class="t-reset">Reset</button></div>
  </div>`;
}
// ---- TIMER controller (single active timer; countdown or stopwatch) ----
let _timerInt=null, _timerState=null;
function stopTimer(){ if(_timerInt){clearInterval(_timerInt);_timerInt=null;} _timerState=null; }
function bindTimer(){
  const box=document.querySelector('.timerbox'); if(!box) return;
  if(_timerInt){clearInterval(_timerInt);_timerInt=null;}
  const dur=+box.dataset.dur, kind=box.dataset.kind;
  _timerState={dur,kind,elapsed:0,running:false};
  const disp=box.querySelector('.tdisp'), note=box.querySelector('.tnote');
  const start=box.querySelector('.t-start'), reset=box.querySelector('.t-reset');
  function paint(){
    const shown = kind==='countdown' ? Math.max(0,dur-_timerState.elapsed) : _timerState.elapsed;
    disp.textContent=fmtT(shown);
    const over = kind==='elapsed' && _timerState.elapsed>=dur;
    const done = kind==='countdown' && _timerState.elapsed>=dur;
    box.classList.toggle('over',over); box.classList.toggle('done',done);
    note.textContent = done ? 'Time’s up.' : (over ? `Over ${fmtT(dur)} — get medical help now.` : '');
  }
  function halt(){ if(_timerInt){clearInterval(_timerInt);_timerInt=null;} _timerState.running=false; }
  function tick(){
    if(!_timerState) return;
    _timerState.elapsed++;
    if(kind==='countdown' && _timerState.elapsed>=dur){ _timerState.elapsed=dur; halt(); start.textContent='Done'; paint(); return; }
    paint();
  }
  start.onclick=()=>{
    if(!_timerState) return;
    if(_timerState.running){ halt(); start.textContent='Resume'; }
    else { _timerState.running=true; start.textContent='Pause'; _timerInt=setInterval(tick,1000); }
  };
  reset.onclick=()=>{ halt(); _timerState.elapsed=0; start.textContent='Start'; paint(); };
  paint();
}
function callIco(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 5 5L16 13l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`; }

/* ---------- MAP ---------- */
function renderMap(al){
  const ids=Object.keys(al.nodes);
  const idx={}; ids.forEach((id,i)=>idx[id]=i);
  const legend=`<div class="legend">
    <span><i class="dot" style="color:var(--sev-info)"></i>Assess</span>
    <span><i class="dot" style="color:var(--sev-caution)"></i>Caution</span>
    <span><i class="dot" style="color:var(--sev-severe)"></i>Severe</span>
    <span><i class="dot" style="color:var(--sev-critical)"></i>Critical</span>
    <span><i class="dot" style="color:var(--sev-safe)"></i>Safe</span></div>`;
  let html=`<p class="sub">Tap any box for detail. Tap a branch to jump to where it leads.</p>${legend}<div class="flow">`;
  ids.forEach((id,i)=>{
    const n=al.nodes[id];
    if(i>0) html+=`<div class="connector"></div>`;
    html+=`<div class="node sev-${n.severity||'info'}" id="map-${id}" data-node="${id}">
      <div class="ntag"><span class="ico">${icon(n.type)}</span><span class="tt">${TYPE_META[n.type].label}</span></div>
      <h2>${esc(n.title)}</h2>${n.prompt?`<p class="prompt">${esc(n.prompt)}</p>`:''}`;
    if(n.type==='decision'){
      html+=`<div class="branches">`+n.branches.map(b=>{
        const loop = idx[b.goto]<=i;
        return `<div class="branch sev-${b.severity||'info'}" data-jump="${b.goto}">
          <div><div class="bl">${esc(b.label)}</div>${b.detail?`<div class="bd">${esc(b.detail)}</div>`:''}
          ${loop?`<div class="loopnote">↩ loops back to “${esc(al.nodes[b.goto].title)}”</div>`:''}</div>
          <span class="arr">→</span></div>`;
      }).join('')+`</div>`;
    } else if(n.type==='cpr'){
      const c=coachCfg(n);
      const init=c.initialBreaths>0?`${c.initialBreaths} initial breaths, then `:'';
      html+=`<div style="margin-top:6px" class="prompt">${init}${c.compressions} compressions : ${c.breaths} breaths · 100–120/min · depth ${esc(c.depth)}</div>`;
    } else if(n.dosing){ html+=`<div style="margin-top:6px">${renderDosing(n)}</div>`; }
    if(n.timer){ const mins=Math.round(n.timer.durationSec/60); html+=`<div style="margin-top:6px" class="prompt">⏱ ${esc(n.timer.label)} · ${n.timer.kind==='countdown'?`${mins} min countdown`:`stopwatch, flag at ${mins} min`}</div>`; }
    html+=`</div>`;
  });
  html+=`</div>`;
  return html;
}

/* ---------- GUIDE ---------- */
function renderGuide(al){
  const n=al.nodes[app.nodeId];
  const step=app.history.length+1;
  const dots=Array.from({length:Math.min(step,7)},(_,k)=>`<i class="${k<step?'on':''}"></i>`).join('');
  let h=`<div class="progress"><span class="pn">Step ${step}</span><div class="track">${dots}</div></div>`;
  if(n.type==='cpr'){
    h+=renderCoach(al,n);
    h+=`<div class="gnav">`;
    if(n.next) h+=`<button class="gbtn primary" data-go="${n.next}"><span>Stop — check for signs of life</span><span class="arr">›</span></button>`;
    if(app.history.length) h+=`<button class="gbtn restart" data-back="1"><span>‹ Back</span><span></span></button>`;
    h+=`</div>`;
    return h;
  }
  h+=`<div class="node sev-${n.severity||'info'}">
    <div class="ntag"><span class="ico">${icon(n.type)}</span><span class="tt">${TYPE_META[n.type].label}</span></div>
    <h2>${esc(n.title)}</h2>${n.prompt?`<p class="prompt">${esc(n.prompt)}</p>`:''}
    ${nodeInner(al,n)}</div>`;
  // navigation
  h+=`<div class="gnav">`;
  if(n.type==='decision'){
    h+=n.branches.map(b=>`<button class="gbtn branch sev-${b.severity||'info'}" data-go="${b.goto}">
      <span class="col"><span>${esc(b.label)}</span>${b.detail?`<span class="bd">${esc(b.detail)}</span>`:''}</span><span class="arr">›</span></button>`).join('');
  } else if(n.type==='outcome'){
    h+=`<button class="gbtn restart" data-restart="1"><span>Start over</span><span class="arr">↺</span></button>`;
  } else if(n.next){
    h+=`<button class="gbtn primary" data-go="${n.next}"><span>Continue</span><span class="arr">›</span></button>`;
  }
  if(app.history.length) h+=`<button class="gbtn restart" data-back="1"><span>‹ Back</span><span></span></button>`;
  h+=`</div>`;
  return h;
}

/* ---------- CPR COACH ---------- */
let _audioCtx=null;
function coachCfg(n){
  const b=Object.assign({rate:110,compressions:30,breaths:2,initialBreaths:0,depth:'',hands:'',breathsNote:''}, n.coach||{});
  const ov=(n.contextCoach||{})[app.ctx.age];
  return Object.assign(b, ov||{});
}
function renderCoach(al,n){
  const c=coachCfg(n);
  const med=mediaFor(n);
  let chips=[];
  (n.refs||[]).forEach(r=>{ const ref=al.references[r]; if(ref) chips.push(`<button class="chip" data-ref="${r}">${icon('observe')} ${esc(ref.title)}</button>`); });
  (n.links||[]).forEach(l=>{ if(l.action==='call') chips.push(`<button class="chip call" data-call="1">${callIco()} ${esc(l.label)}</button>`); });
  const startLabel=c.initialBreaths>0?`Start — ${c.initialBreaths} rescue breaths`:'Start CPR';
  return `<div class="node sev-critical">
    <div class="ntag"><span class="ico">${icon('cpr')}</span><span class="tt">${TYPE_META.cpr.label}</span></div>
    <h2>${esc(n.title)}</h2>
    <div class="coach">
      <div class="coach-stat"><span>Cycles <b id="cCycle">0</b></span><span>Total <b id="cTotal">0</b></span><span id="cTimer">0:00</span></div>
      <div class="metro" id="cMetro">
        <div class="mnum" id="cNum">${c.compressions}</div>
        <div class="mlbl" id="cLbl">ready</div>
        <div class="msub" id="cSub">push ~${c.rate}/min</div>
      </div>
      <div class="coach-tech">
        <div class="row"><span class="k">Hands</span><div>${esc(c.hands)}</div></div>
        <div class="row"><span class="k">Depth</span><div>${esc(c.depth)}</div></div>
        <div class="row"><span class="k">Rate</span><div>About 2 pushes a second — push hard, let the chest come all the way back up</div></div>
      </div>
      ${c.breathsNote?`<div class="coach-note">${esc(c.breathsNote)}</div>`:''}
      ${med?mediaBlock(med):''}
      <div class="coach-ctrls">
        <button class="cbtn-go" id="cStart">${startLabel}</button>
        <button class="cbtn-sec" id="cStop">Reset</button>
      </div>
      <label class="coach-sound"><input type="checkbox" id="cSound" checked> Metronome sound</label>
      ${chips.length?`<div class="chips">${chips.join('')}</div>`:''}
    </div>
  </div>`;
}
function fmtT(s){ s=Math.floor(s); const m=Math.floor(s/60); const ss=s%60; return m+':'+(ss<10?'0':'')+ss; }
function coachTick(){
  if(!app.coach||!app.coach.sound) return;
  try{ _audioCtx=_audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=_audioCtx.createOscillator(), g=_audioCtx.createGain();
    o.frequency.value=1100; g.gain.value=0.07; o.connect(g); g.connect(_audioCtx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001,_audioCtx.currentTime+0.05); o.stop(_audioCtx.currentTime+0.06);
  }catch(e){}
}
function stopCoach(){
  const co=app.coach; if(!co) return;
  if(co.beat) clearInterval(co.beat);
  if(co.tmr) clearInterval(co.tmr);
  if(co.breathTO) clearTimeout(co.breathTO);
  app.coach=null;
}
function setC(id,v){ const e=$(id); if(e) e.textContent=v; }
function setStartLabel(t){ setC('cStart',t); }
function setMetroMode(mode){ const m=$('cMetro'); if(m) m.classList.toggle('breaths', mode==='breaths'); }
function pulse(){ const m=$('cMetro'); if(!m) return; m.classList.add('beat'); setTimeout(()=>{const x=$('cMetro'); if(x)x.classList.remove('beat');},80); }
function initCoach(n){
  stopCoach();
  const c=coachCfg(n);
  app.coach={cfg:c, phase:'ready', count:0, total:0, cycle:0, accum:0, t0:0, sound:true, beat:null, tmr:null, breathTO:null, prevPhase:null};
  const sb=$('cStart'); if(sb) sb.onclick=coachStartPause;
  const st=$('cStop'); if(st) st.onclick=coachReset;
  const sn=$('cSound'); if(sn) sn.onchange=()=>{ if(app.coach) app.coach.sound=sn.checked; };
  const mt=$('cMetro'); if(mt) mt.onclick=coachMetroTap;
}
function startTimerLoop(){
  const co=app.coach; if(!co) return; if(co.tmr) clearInterval(co.tmr);
  co.tmr=setInterval(()=>{ const c=app.coach; if(!c) return;
    const el=c.accum + (c.t0?(Date.now()-c.t0)/1000:0); setC('cTimer',fmtT(el));
  },400);
}
function freezeElapsed(){ const co=app.coach; if(co&&co.t0){ co.accum+=(Date.now()-co.t0)/1000; co.t0=0; } }
function enterCompressions(){
  const co=app.coach; if(!co) return; co.phase='compressions';
  setMetroMode('compressions'); setStartLabel('Pause');
  setC('cLbl','compressions'); setC('cSub','of '+co.cfg.compressions); setC('cNum', co.count);
  if(co.beat) clearInterval(co.beat);
  co.beat=setInterval(beatTick, 60000/co.cfg.rate);
}
function beatTick(){
  const co=app.coach; if(!co) return;
  co.count++; co.total++; pulse(); coachTick();
  setC('cNum', co.count); setC('cTotal', co.total);
  if(co.count>=co.cfg.compressions){ clearInterval(co.beat); co.beat=null; enterBreaths(co.cfg.breaths, false); }
}
function enterBreaths(nb, isInitial){
  const co=app.coach; if(!co) return; co.phase=isInitial?'initial':'breaths';
  setMetroMode('breaths'); setStartLabel('Pause');
  setC('cNum', nb); setC('cLbl', isInitial?'rescue breaths':'breaths'); setC('cSub','tap circle when done');
  const ms = isInitial ? Math.max(8000, nb*1800) : Math.max(5000, nb*2500);
  if(co.breathTO) clearTimeout(co.breathTO);
  co.breathTO=setTimeout(()=>endBreaths(isInitial), ms);
}
function endBreaths(isInitial){
  const co=app.coach; if(!co) return;
  if(co.breathTO){ clearTimeout(co.breathTO); co.breathTO=null; }
  if(!isInitial){ co.cycle++; setC('cCycle', co.cycle); }
  co.count=0; setC('cNum',0);
  enterCompressions();
}
function coachStartPause(){
  const co=app.coach; if(!co) return;
  if(co.phase==='ready'){ co.t0=Date.now(); startTimerLoop(); if(co.cfg.initialBreaths>0) enterBreaths(co.cfg.initialBreaths,true); else enterCompressions(); return; }
  if(co.phase==='paused'){ co.t0=Date.now(); startTimerLoop(); enterCompressions(); return; }
  co.prevPhase=co.phase; co.phase='paused';
  if(co.beat){ clearInterval(co.beat); co.beat=null; }
  if(co.breathTO){ clearTimeout(co.breathTO); co.breathTO=null; }
  freezeElapsed(); setStartLabel('Resume'); setC('cSub','paused');
}
function coachMetroTap(){
  const co=app.coach; if(!co) return;
  if(co.phase==='breaths'||co.phase==='initial') endBreaths(co.phase==='initial');
}
function coachReset(){
  const al=ALGOS[app.algoId]; const n=al.nodes[app.nodeId]; const c=coachCfg(n);
  initCoach(n);
  setMetroMode('compressions');
  setC('cNum', c.compressions); setC('cLbl','ready'); setC('cSub','push ~'+c.rate+'/min');
  setC('cTimer','0:00'); setC('cTotal','0'); setC('cCycle','0');
  setStartLabel(c.initialBreaths>0?('Start — '+c.initialBreaths+' rescue breaths'):'Start CPR');
}

/* ---------- bindings ---------- */
function bindAlgo(al){
  $('backHome').onclick=home;
  document.querySelectorAll('#modeToggle button').forEach(b=>b.onclick=()=>{ app.mode=b.dataset.mode; if(app.mode==='guide'&&!al.nodes[app.nodeId]){app.nodeId=al.entry;app.history=[];} render(); });
  document.querySelectorAll('[data-ctx]').forEach(b=>b.onclick=()=>{ app.ctx[b.dataset.ctx]=b.dataset.val; render(); });
  const num=$('ctxNum'); if(num) num.oninput=()=>{ app.ctx.weight=num.value; refreshDoses(); };
  // map interactions
  document.querySelectorAll('.flow [data-node]').forEach(el=>el.onclick=ev=>{ if(ev.target.closest('[data-jump]'))return; openNodeSheet(el.dataset.node); });
  document.querySelectorAll('[data-jump]').forEach(el=>el.onclick=ev=>{ ev.stopPropagation(); focusNode(el.dataset.jump); });
  // guide interactions
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ app.history.push(app.nodeId); app.nodeId=b.dataset.go; render(); });
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{ app.nodeId=app.history.pop(); render(); });
  document.querySelectorAll('[data-restart]').forEach(b=>b.onclick=()=>{ app.nodeId=al.entry; app.history=[]; render(); });
  bindContent();
}
function bindContent(){
  document.querySelectorAll('[data-ref]').forEach(b=>b.onclick=e=>{e.stopPropagation();openRefSheet(b.dataset.ref);});
  document.querySelectorAll('[data-call]').forEach(b=>b.onclick=e=>{e.stopPropagation();toast('Calling emergency services… (prototype)');});
  document.querySelectorAll('[data-link]').forEach(b=>b.onclick=e=>{e.stopPropagation(); const id=b.dataset.link; if(id && ALGOS[id]){ closeSheet(true); openAlgo(id); } else { toast('Would open: '+b.dataset.llabel+' (not in this prototype)'); }});
  bindTimer();
}
function refreshDoses(){ // light re-render keeping focus on weight field
  const al=ALGOS[app.algoId];
  if(app.openSheet){ if(app.openSheet.type==='node') openNodeSheet(app.openSheet.id,true); }
  if(app.mode==='guide'){
    const n=al.nodes[app.nodeId];
    if((n.dosing||[]).length){ // re-render guide body region
      const scrollY=$('screen').scrollTop; render(); $('screen').scrollTop=scrollY;
      const num=$('ctxNum'); if(num){ num.focus(); num.setSelectionRange(num.value.length,num.value.length); }
    }
  } else { const scrollY=$('screen').scrollTop; render(); $('screen').scrollTop=scrollY; const num=$('ctxNum'); if(num){num.focus();} }
}
function focusNode(id){
  app.openSheet=null;
  const el=$('map-'+id); if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
}

/* ---------- SHEETS ---------- */
function showSheet(html){ const s=$('sheet'); s.innerHTML=`<div class="grip"></div>`+html; $('backdrop').classList.add('show'); s.classList.add('show'); bindContent(); bindSheetExtra(); }
function closeSheet(silent){ $('sheet').classList.remove('show'); $('backdrop').classList.remove('show'); if(!silent)app.openSheet=null; }
function sheetHead(title){ return `<div class="shead"><h2>${esc(title)}</h2><button class="x" onclick="closeSheet()">✕</button></div>`; }

function openNodeSheet(id,keepState){
  const al=ALGOS[app.algoId], n=al.nodes[id]; if(!keepState)app.openSheet={type:'node',id};
  let h=sheetHead(n.title)+`<div class="sbody">
    <div class="ntag"><span class="ico" style="color:var(--sev-${n.severity||'info'});background:var(--sev-${n.severity||'info'}-bg)">${icon(n.type)}</span><span class="tt" style="color:var(--sev-${n.severity||'info'})">${TYPE_META[n.type].label}</span></div>
    ${n.prompt?`<p class="prompt" style="margin-bottom:6px">${esc(n.prompt)}</p>`:''}`;
  if(n.type==='decision'){
    h+=`<div class="branches">`+n.branches.map(b=>`<div class="branch sev-${b.severity||'info'}" onclick="jumpFromSheet('${b.goto}')"><div><div class="bl">${esc(b.label)}</div>${b.detail?`<div class="bd">${esc(b.detail)}</div>`:''}<div class="loopnote">→ ${esc(al.nodes[b.goto].title)}</div></div><span class="arr">→</span></div>`).join('')+`</div>`;
  } else {
    h+=nodeInner(al,n);
    h+=`<button class="gbtn primary startstep" onclick="startFromHere('${id}')"><span>Walk this step by step</span><span class="arr">›</span></button>`;
  }
  h+=`</div>`;
  showSheet(h);
}
function jumpFromSheet(id){ closeSheet(); setTimeout(()=>focusNode(id),120); }
function startFromHere(id){ app.mode='guide'; app.nodeId=id; app.history=[]; closeSheet(); render(); }

function openRefSheet(id){
  const al=ALGOS[app.algoId], r=al.references[id]; app.openSheet={type:'ref',id};
  let h=sheetHead(r.title)+`<div class="sbody">`;
  if(r.warning) h+=`<div class="warn">${icon('outcome')}<span>${esc(r.warning)}</span></div>`;
  if(r.kind==='procedure'){
    if(r.variants){
      const keys=Object.keys(r.variants);
      if(app.refVariant===undefined||!r.variants[app.refVariant]) app.refVariant = (r.variants[app.ctx.age]?app.ctx.age:keys[0]);
      h+=`<div class="choice" style="margin:10px 0 4px">`+keys.map(k=>`<button data-rv="${k}" class="${app.refVariant===k?'on':''}">${esc(r.variants[k].label)}</button>`).join('')+`</div>`;
      const v=r.variants[app.refVariant];
      h+=`<ol class="steps">`+v.steps.map(s=>`<li>${esc(s)}</li>`).join('')+`</ol>`;
      if(v.media) h+=mediaBlock(v.media);
    } else {
      h+=`<ol class="steps">`+r.steps.map(s=>`<li>${esc(s)}</li>`).join('')+`</ol>`;
      if(r.media) h+=mediaBlock(r.media);
    }
  } else if(r.kind==='table'){
    h+=`<div class="tablewrap"><table class="dt"><thead><tr>`+r.columns.map(c=>`<th>${esc(c)}</th>`).join('')+`</tr></thead><tbody>`+
      r.rows.map(row=>`<tr>`+row.map(c=>`<td>${esc(c)}</td>`).join('')+`</tr>`).join('')+`</tbody></table></div>`;
    if(r.note) h+=`<p class="sub" style="margin-top:10px">${esc(r.note)}</p>`;
  } else if(r.kind==='image'){
    h+=mediaBlock({src:r.src,alt:r.alt,caption:r.alt});
  }
  h+=`</div>`;
  showSheet(h);
}
function bindSheetExtra(){
  document.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{ app.refVariant=b.dataset.rv; openRefSheet(app.openSheet.id); });
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- init ---------- */
// Public-only mockup: audience is fixed to 'public' (the clinician toggle was removed).
document.body.className = 'theme-public';
render();
</script>
</body>
</html>
