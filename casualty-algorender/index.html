<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlgoRender — Casualty algorithm prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --font-display:'Fraunces',Georgia,serif;
    --font-sans:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --sev-info:#5b6b73;   --sev-info-bg:#eef2f3;
    --sev-safe:#2f8f5b;   --sev-safe-bg:#e9f5ed;
    --sev-caution:#bb7d12; --sev-caution-bg:#fbf2dd;
    --sev-severe:#df6a2c; --sev-severe-bg:#fceadd;
    --sev-critical:#d8443a; --sev-critical-bg:#fbe4e2;
    --radius:18px;
    --shadow:0 18px 50px -20px rgba(40,28,16,.45);
  }
  /* THEMES */
  body.theme-public{
    --paper:#FBF7F0; --ink:#231f1a; --muted:#7c7165; --line:#ece2d3;
    --card:#ffffff; --accent:#d8443a; --accent-ink:#fff; --chip:#f3ece1;
  }
  body.theme-hcp{
    --paper:#eef2f4; --ink:#192a2e; --muted:#5f7378; --line:#d8e2e4;
    --card:#ffffff; --accent:#1f7a72; --accent-ink:#fff; --chip:#e3edee;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--font-sans);
    background:
      radial-gradient(1200px 700px at 15% -10%, #efe7d8, transparent 60%),
      radial-gradient(1000px 800px at 110% 10%, #e7ecec, transparent 55%),
      #e4ded2;
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:20px 12px;
    -webkit-font-smoothing:antialiased;
  }
  .stage{display:flex;flex-direction:column;align-items:center;gap:12px}
  .caption{font-size:12.5px;color:#6b6256;letter-spacing:.01em;max-width:412px;text-align:center;line-height:1.5}
  .caption b{color:#3a332e}

  /* DEVICE */
  .device{
    width:412px; max-width:96vw; height:min(884px,94vh);
    background:#100f0e; border-radius:46px; padding:11px;
    box-shadow:var(--shadow);
  }
  .phone{
    position:relative; height:100%; width:100%;
    background:var(--paper); border-radius:36px; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:108px;height:24px;background:#100f0e;border-radius:14px;z-index:40}
  .statusbar{height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 24px;font-size:12px;font-weight:600;color:var(--ink);opacity:.7}
  .statusbar .dots{font-family:var(--font-mono);letter-spacing:1px}

  /* APP BAR */
  .appbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 16px 12px}
  .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 4px 10px -4px var(--accent)}
  .mark svg{width:18px;height:18px}
  .brand{line-height:1}
  .brand .b1{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.01em}
  .brand .b2{font-size:10.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
  .seg{margin-left:auto;display:flex;background:var(--chip);border-radius:999px;padding:3px}
  .seg button{border:0;background:transparent;font-family:var(--font-sans);font-weight:600;font-size:12px;color:var(--muted);padding:6px 11px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px -2px rgba(0,0,0,.18)}

  /* SCREEN */
  .screen{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:4px 16px 26px;scroll-behavior:smooth}
  .screen::-webkit-scrollbar{width:0}

  h1.title{font-family:var(--font-display);font-weight:600;font-size:27px;line-height:1.1;margin:6px 2px 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 2px 14px;line-height:1.5}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:8px 2px 0}

  /* HOME CARDS */
  .home-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;margin-bottom:12px;cursor:pointer;overflow:hidden;transition:transform .12s ease, box-shadow .12s ease}
  .home-card:hover{transform:translateY(-2px);box-shadow:0 14px 30px -22px rgba(0,0,0,.5)}
  .home-card .rail{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
  .home-card h3{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0 0 3px}
  .home-card .cat{font-size:12.5px;color:var(--muted)}
  .home-card .meta{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
  .pill.sev{background:var(--sev-bg);color:var(--sev)}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

  /* CONTROL BAR */
  .ctrlbar{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
  .back{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px 7px 10px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  .modetoggle{margin-left:auto;display:flex;background:var(--chip);border-radius:999px;padding:3px}
  .modetoggle button{border:0;background:transparent;font-weight:600;font-size:12.5px;color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .modetoggle button.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 9px -3px var(--accent)}
  .modetoggle svg{width:14px;height:14px}

  /* CONTEXT BAR */
  .ctx{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:11px 13px;margin-bottom:14px}
  .ctx .lbl{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
  .choice{display:flex;gap:8px;flex-wrap:wrap}
  .choice button{flex:1;min-width:120px;border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:9px 10px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  .choice button.on{border-color:var(--accent);background:var(--sev-info-bg);box-shadow:inset 0 0 0 1px var(--accent)}
  .wt{display:flex;align-items:center;gap:9px}
  .wt input{flex:1;font-family:var(--font-mono);font-size:16px;font-weight:600;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--paper);color:var(--ink);width:100%}
  .wt input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
  .wt .u{font-family:var(--font-mono);font-weight:600;color:var(--muted)}

  /* NODE CARD (shared) */
  .node{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--sev);border-radius:var(--radius);padding:14px 15px;position:relative}
  .node .ntag{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .ntag .ico{width:24px;height:24px;border-radius:7px;background:var(--sev-bg);color:var(--sev);display:flex;align-items:center;justify-content:center}
  .ntag .ico svg{width:15px;height:15px}
  .ntag .tt{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--sev)}
  .node h2{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1.18;margin:0 0 4px}
  .prompt{font-size:13.5px;color:var(--muted);margin:2px 0 0}
  ul.body{list-style:none;margin:10px 0 0;padding:0}
  ul.body li{position:relative;padding:5px 0 5px 20px;font-size:14px;line-height:1.45;border-top:1px solid var(--line)}
  ul.body li:first-child{border-top:0}
  ul.body li::before{content:"";position:absolute;left:3px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--sev);opacity:.55}

  .warn{display:flex;gap:9px;background:var(--sev-critical-bg);border:1px solid color-mix(in srgb,var(--sev-critical) 30%,transparent);color:#9a2820;border-radius:12px;padding:10px 11px;margin-top:11px;font-size:13px;line-height:1.4;font-weight:500}
  .warn svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px}

  /* DOSING */
  .dose{margin-top:11px;background:var(--sev-info-bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .dose .drug{font-size:13px;font-weight:700;margin-bottom:5px}
  .dose .val{font-family:var(--font-mono);font-size:21px;font-weight:600;color:var(--ink);line-height:1}
  .dose .val .calc{color:var(--accent)}
  .dose .formula{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:4px}
  .dose .note{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}
  .dose .hint{font-size:12px;color:var(--accent);font-weight:600;margin-top:6px}
  .dose+.dose{margin-top:8px}
  .bands{display:flex;flex-direction:column;gap:5px;margin-top:6px}
  .band{display:flex;justify-content:space-between;font-size:13px;font-family:var(--font-mono);padding:5px 9px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
  .band b{color:var(--accent)}

  /* CHIPS row (refs/links) */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;cursor:pointer;color:var(--ink)}
  .chip svg{width:13px;height:13px;color:var(--muted)}
  .chip.call{background:var(--sev-critical);border-color:var(--sev-critical);color:#fff}
  .chip.call svg{color:#fff}

  .media{margin-top:12px;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:6px}
  .media img{width:100%;display:block;border-radius:10px;background:#fff}
  .media .cap{font-size:12px;color:var(--muted);padding:7px 8px 4px;line-height:1.4}

  /* MAP */
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin:0 2px 12px;font-size:11px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .connector{height:22px;display:flex;justify-content:center}
  .connector::before{content:"";width:2px;background:var(--line)}
  .flow .node{cursor:pointer;transition:box-shadow .12s ease, transform .12s ease}
  .flow .node:hover{box-shadow:0 12px 26px -20px rgba(0,0,0,.55)}
  .flow .node.pulse{animation:pulse 1.1s ease}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
  .branches{display:flex;flex-direction:column;gap:8px;margin-top:11px}
  .branch{display:flex;align-items:flex-start;gap:9px;text-align:left;border:1px solid var(--line);background:var(--paper);border-left:4px solid var(--sev);border-radius:11px;padding:9px 11px;cursor:pointer;width:100%}
  .branch .bl{font-size:13.5px;font-weight:700;color:var(--ink)}
  .branch .bd{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4;font-family:var(--font-mono)}
  .branch .arr{margin-left:auto;color:var(--sev);font-weight:700;flex:0 0 auto}
  .loopnote{font-size:11px;color:var(--muted);font-style:italic;margin-top:2px}

  /* GUIDE */
  .progress{display:flex;align-items:center;gap:7px;margin:2px 2px 12px}
  .progress .pn{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
  .track{display:flex;gap:5px}
  .track i{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .track i.on{background:var(--accent)}
  .gnav{margin-top:14px;display:flex;flex-direction:column;gap:9px}
  .gbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-radius:13px;padding:14px 16px;font-family:var(--font-sans);font-size:15px;font-weight:700;cursor:pointer;text-align:left;width:100%}
  .gbtn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px -10px var(--accent)}
  .gbtn.branch{background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--sev)}
  .gbtn.branch .bd{font-weight:500;font-size:12px;color:var(--muted);font-family:var(--font-mono);margin-top:3px}
  .gbtn .col{display:flex;flex-direction:column}
  .gbtn .arr{font-size:18px;opacity:.8}
  .restart{background:var(--chip);color:var(--ink)}

  /* CALL BAR (public) */
  .callbar{flex:0 0 auto;padding:10px 16px;border-top:1px solid var(--line);background:var(--paper)}
  .callbtn{width:100%;border:0;background:var(--sev-critical);color:#fff;font-family:var(--font-sans);font-weight:700;font-size:15px;border-radius:14px;padding:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 8px 22px -10px var(--sev-critical)}
  .callbtn svg{width:18px;height:18px}

  /* SHEET */
  .backdrop{position:fixed;inset:0;background:rgba(20,14,8,.42);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:60}
  .backdrop.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,102%);width:412px;max-width:96vw;max-height:82vh;background:var(--paper);border-radius:26px 26px 0 0;z-index:70;transition:transform .28s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;box-shadow:0 -20px 60px -20px rgba(0,0,0,.5)}
  .sheet.show{transform:translate(-50%,0)}
  .sheet .grip{width:42px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 4px;flex:0 0 auto}
  .sheet .shead{display:flex;align-items:center;gap:10px;padding:6px 18px 10px;border-bottom:1px solid var(--line)}
  .sheet .shead h2{font-family:var(--font-display);font-weight:600;font-size:18px;margin:0;flex:1}
  .sheet .x{border:0;background:var(--chip);width:30px;height:30px;border-radius:50%;font-size:16px;color:var(--ink);cursor:pointer;flex:0 0 auto}
  .sheet .sbody{overflow-y:auto;padding:14px 18px 24px}
  .steps{list-style:none;counter-reset:s;margin:8px 0 0;padding:0}
  .steps li{counter-increment:s;position:relative;padding:9px 0 9px 38px;font-size:14px;line-height:1.45;border-top:1px solid var(--line)}
  .steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:25px;height:25px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--font-mono);font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center}
  table.dt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  table.dt th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:7px 8px;border-bottom:2px solid var(--line)}
  table.dt td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.4}
  table.dt td:nth-child(1){font-weight:700}
  table.dt td:nth-child(2){font-family:var(--font-mono);color:var(--accent);white-space:nowrap}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  .sheet .startstep{margin-top:16px}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#171310;color:#fff;font-size:13.5px;font-weight:600;padding:12px 18px;border-radius:999px;z-index:90;opacity:0;transition:all .25s ease;pointer-events:none;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body class="theme-public">
  <div class="stage">
    <div class="device">
      <div class="phone">
        <div class="notch"></div>
        <div class="statusbar"><span>9:41</span><span class="dots">offline · ▮▮▮</span></div>
        <div class="appbar">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v16M4 12h16" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg>
          </div>
          <div class="brand"><div class="b1">Casualty</div><div class="b2">AlgoRender</div></div>
          <div class="seg" id="audienceSeg">
            <button data-aud="public">Public</button>
            <button data-aud="hcp">Clinician</button>
          </div>
        </div>
        <main class="screen" id="screen"></main>
        <div class="callbar" id="callbar" style="display:none">
          <button class="callbtn" onclick="toast('Calling emergency services… (prototype)')">
            <svg viewBox="0 0 24 24" fill="none"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 5 5L16 13l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            Call an ambulance
          </button>
        </div>
      </div>
    </div>
    <div class="caption">One renderer, two views, fed by structured data. <b>Map</b> to orient · <b>Guide</b> to act. Works fully offline. Prototype for ideation — take into Claude Design.</div>
  </div>

  <div class="backdrop" id="backdrop" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast"></div>

<script type="application/json" id="algo-choking">
{
  "id":"choking","title":"Choking","audience":"public","category":"Life-threatening","version":"1.0",
  "sourcePdf":"First Aid Algorithms/Choking.pdf","lastReviewed":"2023",
  "disclaimer":"First-aid guidance for the public. It does not replace professional medical care. If in doubt, call for help.",
  "description":"Choking happens when a foreign object blocks the throat and breathing becomes difficult or stops. Children often choke on small objects; most adult cases happen while eating.",
  "contexts":[{"id":"age","type":"choice","label":"Who is choking?","options":[{"id":"over1","label":"Adult or child (over 1 year)"},{"id":"baby","label":"Baby (under 1 year)"}],"default":"over1"}],
  "entry":"recognise",
  "nodes":{
    "recognise":{"id":"recognise","type":"observe","title":"Recognise choking","severity":"info","body":["The person is trying to cough something up","They cannot speak or make any sound","They clutch their throat","Lips and tongue start to turn blue","Veins in the face and neck stick out","They become dizzy and may lose consciousness"],"next":"ask"},
    "ask":{"id":"ask","type":"decision","title":"Ask: “Are you choking?”","prompt":"Can they cough, speak or breathe?","branches":[{"label":"Yes — they can cough or breathe","goto":"encourage","severity":"safe"},{"label":"No — silent, cannot breathe","goto":"back_blows","severity":"severe"}]},
    "encourage":{"id":"encourage","type":"action","title":"Encourage them to keep coughing","severity":"safe","body":["Tell them to keep coughing","Do not do anything else — do not hit the back or give thrusts","Stay with them until they breathe normally again"],"next":"watch"},
    "watch":{"id":"watch","type":"decision","title":"Keep watching","prompt":"How are they now?","branches":[{"label":"Breathing normally again","goto":"out_recovered","severity":"safe"},{"label":"Getting worse — cannot cough or breathe","goto":"back_blows","severity":"severe"}]},
    "back_blows":{"id":"back_blows","type":"action","title":"Give 5 blows to the back","severity":"severe","body":["Stand to the side and slightly behind them","Support the chest with one hand and bend them well forward","Give up to 5 sharp blows between the shoulder blades with the heel of your hand","Check after each blow — stop as soon as the object comes out"],"contextBody":{"baby":["Lay the baby face down along your forearm, head low","Support the head and give up to 5 firm blows on the back with the heel of your hand","Check after each blow — stop as soon as the object comes out"]},"media":{"type":"image","src":"media/back_blows.svg","alt":"Giving back blows to a person bent forward","caption":"Support the chest, bend forward, strike between the shoulder blades."},"refs":["back_blows"],"next":"check1"},
    "check1":{"id":"check1","type":"decision","title":"Did the object come out?","prompt":"Can they speak, cough or breathe now?","branches":[{"label":"Yes — it cleared","goto":"out_cleared","severity":"safe"},{"label":"No — still choking","goto":"abd_thrusts","severity":"severe"}]},
    "abd_thrusts":{"id":"abd_thrusts","type":"action","title":"Give 5 abdominal thrusts","severity":"severe","body":["Stand behind them and wrap both arms around the waist","Make a fist and place it between the belly button and the lower tip of the breastbone","Grip your fist with the other hand","Bend them forward and pull sharply inwards and upwards — up to 5 times"],"contextBody":{"baby":["Use CHEST thrusts, not abdominal thrusts","Place two fingers in the middle of the chest","Push sharply inwards and upwards towards the head — up to 5 times"]},"media":{"type":"image","src":"media/abdominal_thrusts.svg","alt":"Giving abdominal thrusts from behind","caption":"Fist above the navel, grip with the other hand, pull in and up."},"warning":"Abdominal and chest thrusts can cause internal injuries. Anyone given thrusts must be seen by a doctor afterwards.","refs":["abd_thrusts"],"next":"check2"},
    "check2":{"id":"check2","type":"decision","title":"Did the object come out?","prompt":"Can they speak, cough or breathe now?","branches":[{"label":"Yes — it cleared","goto":"out_cleared","severity":"safe"},{"label":"No — still choking","goto":"still_conscious","severity":"severe"}]},
    "still_conscious":{"id":"still_conscious","type":"decision","title":"Are they still conscious?","prompt":"Are they still awake and responding?","branches":[{"label":"Yes — keep going","goto":"alternate","severity":"severe"},{"label":"No — they have collapsed","goto":"collapsed","severity":"critical"}]},

<script>
"use strict";
const ALGOS = {
  choking: JSON.parse(document.getElementById('algo-choking').textContent),
  asthma:  JSON.parse(document.getElementById('algo-asthma').textContent)
};
const ORDER = ['choking','asthma'];

const app = { audience:'public', algoId:null, mode:'guide', nodeId:null, history:[], ctx:{}, openSheet:null };

const SEV = ['info','safe','caution','severe','critical'];
const TYPE_META = {
  observe:{label:'Assess'}, decision:{label:'Decide'}, action:{label:'Do'},
  reassess:{label:'Reassess'}, outcome:{label:'Outcome'}
};
function icon(type){
  const s='stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  switch(type){
    case 'observe': return `<svg viewBox="0 0 24 24"><path ${s} d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="2.6" ${s}/></svg>`;
    case 'decision': return `<svg viewBox="0 0 24 24"><path ${s} d="M6 3v6a3 3 0 0 0 3 3h9M18 8l3 4-3 4"/><circle cx="6" cy="3" r="0" ${s}/></svg>`;
    case 'action': return `<svg viewBox="0 0 24 24"><path ${s} d="M5 12h13M13 6l6 6-6 6"/></svg>`;
    case 'reassess': return `<svg viewBox="0 0 24 24"><path ${s} d="M20 11a8 8 0 1 0-2 6m2 2v-5h-5"/></svg>`;
    case 'outcome': return `<svg viewBox="0 0 24 24"><path ${s} d="M5 21V4h13l-2 4 2 4H5"/></svg>`;
    default: return '';
  }
}
const esc = t => String(t==null?'':t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const $ = id => document.getElementById(id);

function setAudience(a){
  app.audience=a; app.algoId=null; app.openSheet=null;
  document.body.className = 'theme-'+a;
  [...$('audienceSeg').children].forEach(b=>b.classList.toggle('on', b.dataset.aud===a));
  closeSheet(true); render();
}

function openAlgo(id){
  const al=ALGOS[id]; app.algoId=id; app.mode='guide';
  app.nodeId=al.entry; app.history=[]; app.ctx={};
  (al.contexts||[]).forEach(c=>{ app.ctx[c.id]= c.default!==undefined?c.default:(c.type==='number'?'':''); });
  render();
}
function home(){ app.algoId=null; closeSheet(true); render(); }

/* ---------- top-level render ---------- */
function render(){
  const scr=$('screen');
  if(!app.algoId){ scr.innerHTML=renderHome(); bindHome(); $('callbar').style.display='none'; return; }
  const al=ALGOS[app.algoId];
  let html = ctrlBar(al) + contextBar(al);
  html += (app.mode==='map') ? renderMap(al) : renderGuide(al);
  scr.innerHTML = html;
  $('callbar').style.display = (al.audience==='public') ? 'block' : 'none';
  bindAlgo(al);
  scr.scrollTop=0;
}

function renderHome(){
  const list = ORDER.map(id=>ALGOS[id]).filter(a=>a.audience===app.audience);
  const intro = app.audience==='public'
    ? 'First-aid guides you can follow step by step — or see the whole flow at a glance.'
    : 'Clinical algorithms as an interactive map, with built-in dosing and reference tables.';
  let cards = list.map(a=>{
    const steps=Object.keys(a.nodes).length;
    return `<div class="home-card" data-open="${a.id}">
      <div class="rail"></div>
      <h3>${esc(a.title)}</h3>
      <div class="cat">${esc(a.category)}</div>
      <div class="meta">
        <span class="pill">${a.audience==='public'?'First aid':'Clinician'}</span>
        <span class="pill">${steps} steps</span>
        <span class="pill">v${esc(a.version)} · ${esc(a.lastReviewed)}</span>
      </div>
    </div>`;
  }).join('');
  return `<div class="eyebrow">${app.audience==='public'?'Self-care & first aid':'Clinical protocols'}</div>
    <h1 class="title">What's happening?</h1>
    <p class="sub">${intro}</p>${cards}
    <p class="sub" style="margin-top:8px;opacity:.8">Two of 87 algorithms shown in this prototype.</p>`;
}
function bindHome(){ document.querySelectorAll('[data-open]').forEach(c=>c.onclick=()=>openAlgo(c.dataset.open)); }

/* ---------- control + context bars ---------- */
function ctrlBar(al){
  return `<div class="ctrlbar">
    <button class="back" id="backHome">‹ All</button>
    <div class="modetoggle" id="modeToggle">
      <button data-mode="map" class="${app.mode==='map'?'on':''}">${icon('decision')} Map</button>
      <button data-mode="guide" class="${app.mode==='guide'?'on':''}">${icon('action')} Guide</button>
    </div>
  </div>
  <div class="eyebrow">${esc(al.category)}</div>
  <h1 class="title">${esc(al.title)}</h1>`;
}
function contextBar(al){
  const c=(al.contexts||[])[0]; if(!c) return '';
  if(c.type==='choice'){
    const opts=c.options.map(o=>`<button data-ctx="${c.id}" data-val="${o.id}" class="${app.ctx[c.id]===o.id?'on':''}">${esc(o.label)}</button>`).join('');
    return `<div class="ctx"><div class="lbl">${esc(c.label)}</div><div class="choice">${opts}</div></div>`;
  }
  if(c.type==='number'){
    return `<div class="ctx"><div class="lbl">${esc(c.label)} — powers live dosing</div>
      <div class="wt"><input id="ctxNum" type="number" inputmode="decimal" placeholder="${esc(c.placeholder||'')}" value="${esc(app.ctx[c.id]||'')}"><span class="u">${esc(c.unit||'')}</span></div></div>`;
  }
  return '';
}

/* ---------- dosing ---------- */
function round(n){ return Number(n.toFixed(1)).toString(); }
function renderDose(d){
  let inner=`<div class="drug">${esc(d.drug)}</div>`;
  if(d.fixed){
    inner+=`<div class="val">${esc(d.fixed)}</div>`;
  } else if(d.formula){
    const f=d.formula, w=parseFloat(app.ctx.weight);
    const base=`${f.perKg} ${f.unit}/kg${f.max?` · max ${f.max} ${f.unit}`:''}`;
    if(w>0){
      let v=f.perKg*w, capped=(f.max&&v>f.max);
      v=capped?f.max:v;
      inner+=`<div class="val"><span class="calc">${round(v)} ${esc(f.unit)}</span></div>
        <div class="formula">${base}${capped?' (capped)':` · ${f.perKg}×${w} kg`}</div>`;
    } else {
      inner+=`<div class="val">${esc(base)}</div><div class="hint">Enter weight above to calculate the dose</div>`;
    }
  } else if(d.bands){
    inner+=`<div class="bands">`+d.bands.map(b=>`<div class="band"><span>${esc(b.match)}</span><b>${esc(b.dose)}</b></div>`).join('')+`</div>`;
  }
  if(d.note) inner+=`<div class="note">${esc(d.note)}</div>`;
  return `<div class="dose">${inner}</div>`;
}
function renderDosing(node){ return (node.dosing||[]).map(renderDose).join(''); }

/* ---------- node content (shared by guide + sheet) ---------- */
function bodyFor(node){
  if(node.contextBody && node.contextBody[app.ctx.age]) return node.contextBody[app.ctx.age];
  return node.body||[];
}
function nodeInner(al,node,opts){
  opts=opts||{};
  let h='';
  const body=bodyFor(node);
  if(body.length) h+=`<ul class="body">`+body.map(b=>`<li>${esc(b)}</li>`).join('')+`</ul>`;
  h+=renderDosing(node);
  if(node.warning) h+=`<div class="warn">${icon('outcome')}<span>${esc(node.warning)}</span></div>`;
  if(opts.media!==false && node.media) h+=mediaBlock(node.media);
  // chips: refs + links
  let chips=[];
  (node.refs||[]).forEach(r=>{ const ref=al.references[r]; if(ref) chips.push(`<button class="chip" data-ref="${r}">${icon('observe')} ${esc(ref.title)}</button>`); });
  (node.links||[]).forEach((l,i)=>{
    if(l.action==='call') chips.push(`<button class="chip call" data-call="1">${callIco()} ${esc(l.label)}</button>`);
    else chips.push(`<button class="chip" data-link="${esc(l.algorithm||'')}" data-llabel="${esc(l.label)}">${icon('action')} ${esc(l.label)}</button>`);
  });
  if(chips.length) h+=`<div class="chips">${chips.join('')}</div>`;
  return h;
}
function mediaBlock(m){ return `<div class="media"><img src="${esc(m.src)}" alt="${esc(m.alt||'')}">${m.caption?`<div class="cap">${esc(m.caption)}</div>`:''}</div>`; }
function callIco(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 5 5L16 13l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`; }

/* ---------- MAP ---------- */
function renderMap(al){
  const ids=Object.keys(al.nodes);
  const idx={}; ids.forEach((id,i)=>idx[id]=i);
  const legend=`<div class="legend">
    <span><i class="dot" style="color:var(--sev-info)"></i>Assess</span>
    <span><i class="dot" style="color:var(--sev-caution)"></i>Caution</span>
    <span><i class="dot" style="color:var(--sev-severe)"></i>Severe</span>
    <span><i class="dot" style="color:var(--sev-critical)"></i>Critical</span>
    <span><i class="dot" style="color:var(--sev-safe)"></i>Safe</span></div>`;
  let html=`<p class="sub">Tap any box for detail. Tap a branch to jump to where it leads.</p>${legend}<div class="flow">`;
  ids.forEach((id,i)=>{
    const n=al.nodes[id];
    if(i>0) html+=`<div class="connector"></div>`;
    html+=`<div class="node sev-${n.severity||'info'}" id="map-${id}" data-node="${id}">
      <div class="ntag"><span class="ico">${icon(n.type)}</span><span class="tt">${TYPE_META[n.type].label}</span></div>
      <h2>${esc(n.title)}</h2>${n.prompt?`<p class="prompt">${esc(n.prompt)}</p>`:''}`;
    if(n.type==='decision'){
      html+=`<div class="branches">`+n.branches.map(b=>{
        const loop = idx[b.goto]<=i;
        return `<div class="branch sev-${b.severity||'info'}" data-jump="${b.goto}">
          <div><div class="bl">${esc(b.label)}</div>${b.detail?`<div class="bd">${esc(b.detail)}</div>`:''}
          ${loop?`<div class="loopnote">↩ loops back to “${esc(al.nodes[b.goto].title)}”</div>`:''}</div>
          <span class="arr">→</span></div>`;
      }).join('')+`</div>`;
    } else if(n.dosing){ html+=`<div style="margin-top:6px">${renderDosing(n)}</div>`; }
    html+=`</div>`;
  });
  html+=`</div>`;
  return html;
}

/* ---------- GUIDE ---------- */
function renderGuide(al){
  const n=al.nodes[app.nodeId];
  const step=app.history.length+1;
  const dots=Array.from({length:Math.min(step,7)},(_,k)=>`<i class="${k<step?'on':''}"></i>`).join('');
  let h=`<div class="progress"><span class="pn">Step ${step}</span><div class="track">${dots}</div></div>`;
  h+=`<div class="node sev-${n.severity||'info'}">
    <div class="ntag"><span class="ico">${icon(n.type)}</span><span class="tt">${TYPE_META[n.type].label}</span></div>
    <h2>${esc(n.title)}</h2>${n.prompt?`<p class="prompt">${esc(n.prompt)}</p>`:''}
    ${nodeInner(al,n)}</div>`;
  // navigation
  h+=`<div class="gnav">`;
  if(n.type==='decision'){
    h+=n.branches.map(b=>`<button class="gbtn branch sev-${b.severity||'info'}" data-go="${b.goto}">
      <span class="col"><span>${esc(b.label)}</span>${b.detail?`<span class="bd">${esc(b.detail)}</span>`:''}</span><span class="arr">›</span></button>`).join('');
  } else if(n.type==='outcome'){
    h+=`<button class="gbtn restart" data-restart="1"><span>Start over</span><span class="arr">↺</span></button>`;
  } else if(n.next){
    h+=`<button class="gbtn primary" data-go="${n.next}"><span>Continue</span><span class="arr">›</span></button>`;
  }
  if(app.history.length) h+=`<button class="gbtn restart" data-back="1"><span>‹ Back</span><span></span></button>`;
  h+=`</div>`;
  return h;
}

/* ---------- bindings ---------- */
function bindAlgo(al){
  $('backHome').onclick=home;
  document.querySelectorAll('#modeToggle button').forEach(b=>b.onclick=()=>{ app.mode=b.dataset.mode; if(app.mode==='guide'&&!al.nodes[app.nodeId]){app.nodeId=al.entry;app.history=[];} render(); });
  document.querySelectorAll('[data-ctx]').forEach(b=>b.onclick=()=>{ app.ctx[b.dataset.ctx]=b.dataset.val; render(); });
  const num=$('ctxNum'); if(num) num.oninput=()=>{ app.ctx.weight=num.value; refreshDoses(); };
  // map interactions
  document.querySelectorAll('.flow [data-node]').forEach(el=>el.onclick=ev=>{ if(ev.target.closest('[data-jump]'))return; openNodeSheet(el.dataset.node); });
  document.querySelectorAll('[data-jump]').forEach(el=>el.onclick=ev=>{ ev.stopPropagation(); focusNode(el.dataset.jump); });
  // guide interactions
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ app.history.push(app.nodeId); app.nodeId=b.dataset.go; render(); });
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{ app.nodeId=app.history.pop(); render(); });
  document.querySelectorAll('[data-restart]').forEach(b=>b.onclick=()=>{ app.nodeId=al.entry; app.history=[]; render(); });
  bindContent();
}
function bindContent(){
  document.querySelectorAll('[data-ref]').forEach(b=>b.onclick=e=>{e.stopPropagation();openRefSheet(b.dataset.ref);});
  document.querySelectorAll('[data-call]').forEach(b=>b.onclick=e=>{e.stopPropagation();toast('Calling emergency services… (prototype)');});
  document.querySelectorAll('[data-link]').forEach(b=>b.onclick=e=>{e.stopPropagation();toast('Would open: '+b.dataset.llabel+' (not in this prototype)');});
}
function refreshDoses(){ // light re-render keeping focus on weight field
  const al=ALGOS[app.algoId];
  if(app.openSheet){ if(app.openSheet.type==='node') openNodeSheet(app.openSheet.id,true); }
  if(app.mode==='guide'){
    const n=al.nodes[app.nodeId];
    if((n.dosing||[]).length){ // re-render guide body region
      const scrollY=$('screen').scrollTop; render(); $('screen').scrollTop=scrollY;
      const num=$('ctxNum'); if(num){ num.focus(); num.setSelectionRange(num.value.length,num.value.length); }
    }
  } else { const scrollY=$('screen').scrollTop; render(); $('screen').scrollTop=scrollY; const num=$('ctxNum'); if(num){num.focus();} }
}
function focusNode(id){
  app.openSheet=null;
  const el=$('map-'+id); if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
}

/* ---------- SHEETS ---------- */
function showSheet(html){ const s=$('sheet'); s.innerHTML=`<div class="grip"></div>`+html; $('backdrop').classList.add('show'); s.classList.add('show'); bindContent(); bindSheetExtra(); }
function closeSheet(silent){ $('sheet').classList.remove('show'); $('backdrop').classList.remove('show'); if(!silent)app.openSheet=null; }
function sheetHead(title){ return `<div class="shead"><h2>${esc(title)}</h2><button class="x" onclick="closeSheet()">✕</button></div>`; }

function openNodeSheet(id,keepState){
  const al=ALGOS[app.algoId], n=al.nodes[id]; if(!keepState)app.openSheet={type:'node',id};
  let h=sheetHead(n.title)+`<div class="sbody">
    <div class="ntag"><span class="ico" style="color:var(--sev-${n.severity||'info'});background:var(--sev-${n.severity||'info'}-bg)">${icon(n.type)}</span><span class="tt" style="color:var(--sev-${n.severity||'info'})">${TYPE_META[n.type].label}</span></div>
    ${n.prompt?`<p class="prompt" style="margin-bottom:6px">${esc(n.prompt)}</p>`:''}`;
  if(n.type==='decision'){
    h+=`<div class="branches">`+n.branches.map(b=>`<div class="branch sev-${b.severity||'info'}" onclick="jumpFromSheet('${b.goto}')"><div><div class="bl">${esc(b.label)}</div>${b.detail?`<div class="bd">${esc(b.detail)}</div>`:''}<div class="loopnote">→ ${esc(al.nodes[b.goto].title)}</div></div><span class="arr">→</span></div>`).join('')+`</div>`;
  } else {
    h+=nodeInner(al,n);
    h+=`<button class="gbtn primary startstep" onclick="startFromHere('${id}')"><span>Walk this step by step</span><span class="arr">›</span></button>`;
  }
  h+=`</div>`;
  showSheet(h);
}
function jumpFromSheet(id){ closeSheet(); setTimeout(()=>focusNode(id),120); }
function startFromHere(id){ app.mode='guide'; app.nodeId=id; app.history=[]; closeSheet(); render(); }

function openRefSheet(id){
  const al=ALGOS[app.algoId], r=al.references[id]; app.openSheet={type:'ref',id};
  let h=sheetHead(r.title)+`<div class="sbody">`;
  if(r.warning) h+=`<div class="warn">${icon('outcome')}<span>${esc(r.warning)}</span></div>`;
  if(r.kind==='procedure'){
    if(r.variants){
      const keys=Object.keys(r.variants);
      if(app.refVariant===undefined||!r.variants[app.refVariant]) app.refVariant = (r.variants[app.ctx.age]?app.ctx.age:keys[0]);
      h+=`<div class="choice" style="margin:10px 0 4px">`+keys.map(k=>`<button data-rv="${k}" class="${app.refVariant===k?'on':''}">${esc(r.variants[k].label)}</button>`).join('')+`</div>`;
      const v=r.variants[app.refVariant];
      h+=`<ol class="steps">`+v.steps.map(s=>`<li>${esc(s)}</li>`).join('')+`</ol>`;
      if(v.media) h+=mediaBlock(v.media);
    } else {
      h+=`<ol class="steps">`+r.steps.map(s=>`<li>${esc(s)}</li>`).join('')+`</ol>`;
      if(r.media) h+=mediaBlock(r.media);
    }
  } else if(r.kind==='table'){
    h+=`<div class="tablewrap"><table class="dt"><thead><tr>`+r.columns.map(c=>`<th>${esc(c)}</th>`).join('')+`</tr></thead><tbody>`+
      r.rows.map(row=>`<tr>`+row.map(c=>`<td>${esc(c)}</td>`).join('')+`</tr>`).join('')+`</tbody></table></div>`;
    if(r.note) h+=`<p class="sub" style="margin-top:10px">${esc(r.note)}</p>`;
  } else if(r.kind==='image'){
    h+=mediaBlock({src:r.src,alt:r.alt,caption:r.alt});
  }
  h+=`</div>`;
  showSheet(h);
}
function bindSheetExtra(){
  document.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{ app.refVariant=b.dataset.rv; openRefSheet(app.openSheet.id); });
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- init ---------- */
$('audienceSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>setAudience(b.dataset.aud));
setAudience('public');
</script>
</body>
</html>
