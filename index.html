<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Demos — AL</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --border: #262b36;
      --text: #e6e8eb;
      --muted: #8b919e;
      --accent: #6ea8fe;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 72px 24px 96px;
    }
    header h1 {
      font-size: 1.6rem;
      margin: 0 0 6px;
      letter-spacing: -0.01em;
    }
    header p {
      margin: 0 0 40px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li { margin: 0 0 14px; }
    a.demo {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    a.demo:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .title {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0 0 4px;
    }
    .desc {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0;
    }
    .arrow { float: right; color: var(--muted); }
    a.demo:hover .arrow { color: var(--accent); }
    footer {
      margin-top: 56px;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Demos</h1>
      <p>A curated list of simple demos and mockups.</p>
    </header>

    <!-- Add new demos by copying a <li> block below. -->
    <ul>
      <li>
        <a class="demo" href="./ashoka-rapid.html">
          <span class="arrow">&rarr;</span>
          <p class="title">Ashoka Rapid</p>
          <p class="desc">Teaser prototype.</p>
        </a>
      </li>
      <li>
        <a class="demo" href="./savana-signatures-grant-ai.html">
          <span class="arrow">&rarr;</span>
          <p class="title">Savana Signatures — Grant AI</p>
          <p class="desc">Grant AI demo.</p>
        </a>
      </li>
      <li>
        <a class="demo" href="./casualty-refinement.html">
          <span class="arrow">&rarr;</span>
          <p class="title">Casualty — Light Visual Refinement</p>
          <p class="desc">Visual refinement mockup for the Casualty app.</p>
        </a>
      </li>
    </ul>

    <footer>Updated as needed · AL</footer>
  </div>
</body>
</html>
